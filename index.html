  <style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio, geometry.
   Put this @layer first; product CSS outside the layer wins ordinary layout rules.
   Native hidden and closed-dialog states take precedence over component display rules. */
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }

  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }

  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }

  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
:root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
/* /OD-LAYOUT-PRIMITIVES v1 */

:root {
  /* Kahoot! Brand & Surface Tokens */
  --k-purple: #46178f;
  --k-purple-dark: #25076b;
  --k-purple-mid: #361075;
  --k-purple-hover: #381273;
  --k-purple-tint: #f1eaff;
  --k-purple-border: #d2bdfc;

  --k-red: #d91636;
  --k-red-lip: #a30f27;
  --k-blue: #1368ce;
  --k-blue-lip: #0d4b96;
  --k-gold: #ffb300;
  --k-gold-lip: #c48200;
  --k-gold-ink: #1c1400;
  --k-green: #217a09;
  --k-green-lip: #165705;
  --k-teal: #0d7490;
  --k-teal-lip: #095266;

  --bg-canvas: #f2f2f2;
  --bg-surface: #ffffff;
  --bg-subtle: #eaeaea;
  --bg-hover: #e0e0e0;
  --border-subtle: #dcdcdc;
  --border-strong: #bdbdbd;

  --text-primary: #1a1a1a;
  --text-secondary: #4a4a4a;
  --text-muted: #666666;

  --brand-primary: #46178f;
  --brand-primary-hover: #381273;
  --brand-primary-tint: #f1eaff;
  --brand-primary-text: #ffffff;

  --status-success-bg: #dcfce7;
  --status-success-text: #166534;
  --status-success-border: #86efac;

  --status-warning-bg: #fef3c7;
  --status-warning-text: #854d0e;
  --status-warning-border: #fcd34d;

  --status-danger-bg: #fee2e2;
  --status-danger-text: #991b1b;
  --status-danger-border: #fca5a5;

  --status-info-bg: #dbeafe;
  --status-info-text: #1e40af;
  --status-info-border: #93c5fd;

  --status-neutral-bg: #ededed;
  --status-neutral-text: #333333;
  --status-neutral-border: #cccccc;

  --font-display: 'Montserrat', 'Be Vietnam Pro', system-ui, sans-serif;
  --font-sans: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Consolas, monospace;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --shadow-card: 0 2px 0 rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 16px 40px rgba(21, 5, 61, 0.28);

  --t-fast: 150ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background-color: var(--bg-canvas);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

button {
  cursor: pointer;
}

a {
  color: var(--brand-primary);
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}

:focus-visible {
  outline: 3px solid #ffb300;
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.mono {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}

.num {
  font-variant-numeric: tabular-nums;
}

/* Kahoot! Wordmark */
.quiq-wordmark {
  font-family: var(--font-display);
  font-weight: 900;
  letter-spacing: -0.03em;
  line-height: 1;
}

/* Tactile 3D Buttons (Kahoot Signature Lip) */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 42px;
  padding: 8px 18px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  border-bottom-width: 4px;
  font-family: var(--font-display);
  font-size: 0.9375rem;
  font-weight: 700;
  line-height: 1.2;
  white-space: nowrap;
  transition: background-color var(--t-fast), border-color var(--t-fast), transform 100ms ease;
}

.btn:active:not(:disabled) {
  transform: translateY(2px);
  border-bottom-width: 2px;
}

.btn-sm {
  min-height: 36px;
  padding: 6px 12px;
  font-size: 0.8125rem;
  border-bottom-width: 3px;
}

.btn-lg {
  min-height: 50px;
  padding: 12px 24px;
  font-size: 1.0625rem;
}

.btn-primary {
  background-color: var(--k-purple);
  color: #ffffff;
  border-color: var(--k-purple);
  border-bottom-color: var(--k-purple-dark);
}
.btn-primary:hover:not(:disabled) {
  background-color: var(--k-purple-hover);
}

.btn-dark {
  background-color: #2b2b2b;
  color: #ffffff;
  border-color: #2b2b2b;
  border-bottom-color: #0d0d0d;
}
.btn-dark:hover:not(:disabled) {
  background-color: #1a1a1a;
}

.btn-secondary {
  background-color: #ffffff;
  color: var(--text-primary);
  border-color: #d4d4d4;
  border-bottom-color: #b0b0b0;
}
.btn-secondary:hover:not(:disabled) {
  background-color: #f7f7f7;
}

.btn-subtle {
  background-color: var(--bg-subtle);
  color: var(--text-primary);
  border-color: transparent;
  border-bottom-color: #cccccc;
}
.btn-subtle:hover:not(:disabled) {
  background-color: var(--bg-hover);
}

.btn-danger {
  background-color: var(--k-red);
  color: #ffffff;
  border-color: var(--k-red);
  border-bottom-color: var(--k-red-lip);
}
.btn-danger:hover:not(:disabled) {
  background-color: #be112e;
}

.btn-danger-outline {
  background-color: #ffffff;
  color: var(--status-danger-text);
  border-color: var(--status-danger-border);
  border-bottom-color: #ef4444;
}
.btn-danger-outline:hover:not(:disabled) {
  background-color: var(--status-danger-bg);
}

.btn-success {
  background-color: var(--k-green);
  color: #ffffff;
  border-color: var(--k-green);
  border-bottom-color: var(--k-green-lip);
}
.btn-success:hover:not(:disabled) {
  background-color: #1c6907;
}

.btn-blue {
  background-color: var(--k-blue);
  color: #ffffff;
  border-color: var(--k-blue);
  border-bottom-color: var(--k-blue-lip);
}
.btn-blue:hover:not(:disabled) {
  background-color: #1058b0;
}

.btn:disabled {
  opacity: 0.48;
  cursor: not-allowed;
}

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 0.8125rem;
  font-weight: 700;
  line-height: 1.3;
  white-space: nowrap;
  border: 1px solid transparent;
}
.badge-success { background: var(--status-success-bg); color: var(--status-success-text); border-color: var(--status-success-border); }
.badge-warning { background: var(--status-warning-bg); color: var(--status-warning-text); border-color: var(--status-warning-border); }
.badge-danger  { background: var(--status-danger-bg);  color: var(--status-danger-text);  border-color: var(--status-danger-border); }
.badge-info    { background: var(--status-info-bg);    color: var(--status-info-text);    border-color: var(--status-info-border); }
.badge-neutral { background: var(--status-neutral-bg); color: var(--status-neutral-text); border-color: var(--status-neutral-border); }
.badge-brand   { background: var(--k-purple-tint); color: var(--k-purple); border-color: var(--k-purple-border); }

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  flex: none;
}

/* Form Controls */
.field-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field-label {
  font-size: 0.875rem;
  font-weight: 700;
  color: var(--text-primary);
}
.field-label .req {
  color: var(--k-red);
  margin-left: 2px;
}

.field-hint {
  font-size: 0.8125rem;
  color: var(--text-muted);
  margin: 0;
}

.input, .select, .textarea {
  width: 100%;
  min-height: 44px;
  padding: 9px 14px;
  border: 2px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background-color: var(--bg-surface);
  color: var(--text-primary);
  font-size: 0.9375rem;
  font-weight: 500;
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}

.textarea {
  min-height: 92px;
  resize: vertical;
  line-height: 1.5;
}

.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--k-purple);
  box-shadow: 0 0 0 3px rgba(70, 23, 143, 0.16);
}

.input-pin {
  min-height: 52px;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 1.125rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  border-width: 2px;
  border-color: #cccccc;
}

/* Cards & Tables */
.card {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-bottom: 3px solid #d4d4d4;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
}

.card-pad {
  padding: 22px 24px;
}

.card-header {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.card-title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.0625rem;
  font-weight: 800;
  color: var(--text-primary);
}

.alert {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border-subtle);
  font-size: 0.9375rem;
}
.alert-info { background: var(--status-info-bg); color: var(--status-info-text); border-color: var(--status-info-border); }
.alert-warning { background: var(--status-warning-bg); color: var(--status-warning-text); border-color: var(--status-warning-border); }
.alert-danger { background: var(--status-danger-bg); color: var(--status-danger-text); border-color: var(--status-danger-border); }
.alert-success { background: var(--status-success-bg); color: var(--status-success-text); border-color: var(--status-success-border); }
.alert-neutral { background: var(--bg-subtle); color: var(--text-secondary); border-color: var(--border-subtle); }

.table-wrap {
  width: 100%;
  overflow-x: auto;
}

table.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9375rem;
}

table.data-table th {
  text-align: left;
  padding: 12px 16px;
  font-size: 0.75rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-secondary);
  background-color: #f7f7f7;
  border-bottom: 2px solid var(--border-subtle);
  white-space: nowrap;
}

table.data-table td {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border-subtle);
  vertical-align: middle;
}

table.data-table tbody tr:last-child td {
  border-bottom: none;
}

table.data-table tbody tr:hover {
  background-color: #faf8ff;
}

/* KPI Grid (Kahoot Report Cards) */
.kpi-grid {
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
}

.kpi-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-bottom: 4px solid #d4d4d4;
  border-radius: var(--radius-md);
  padding: 16px 20px;
}

.kpi-card.kpi-purple { border-bottom-color: var(--k-purple); }
.kpi-card.kpi-green  { border-bottom-color: var(--k-green); }
.kpi-card.kpi-blue   { border-bottom-color: var(--k-blue); }
.kpi-card.kpi-gold   { border-bottom-color: var(--k-gold-lip); }
.kpi-card.kpi-red    { border-bottom-color: var(--k-red); }

.kpi-label {
  font-size: 0.8125rem;
  font-weight: 700;
  color: var(--text-muted);
  margin: 0 0 6px;
}

.kpi-value {
  font-family: var(--font-display);
  font-size: 1.875rem;
  font-weight: 800;
  color: var(--text-primary);
  line-height: 1.15;
  margin: 0;
  font-variant-numeric: tabular-nums;
}

.kpi-sub {
  font-size: 0.8125rem;
  color: var(--text-secondary);
  margin: 6px 0 0;
}

/* =========================================================================
   APP SHELL (Kahoot Studio & Reports Sidebar)
   ========================================================================= */
.app-shell {
  display: grid;
  grid-template-columns: 276px minmax(0, 1fr);
  min-height: 100vh;
}

.sidebar {
  background-color: var(--k-purple-dark);
  color: #ffffff;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
}

.sidebar-brand {
  padding: 20px 18px 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.14);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.brand-lockup {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-mark {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background-color: var(--k-purple);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 1.25rem;
  flex: none;
  border-bottom: 3px solid rgba(0, 0, 0, 0.28);
}

.sidebar .brand-mark {
  background-color: #ffffff;
  color: var(--k-purple);
  border-bottom-color: #d2bdfc;
}

.brand-name {
  font-family: var(--font-display);
  font-size: 1.375rem;
  font-weight: 900;
  letter-spacing: -0.03em;
  color: var(--text-primary);
}

.sidebar .brand-name {
  color: #ffffff;
}

.context-box {
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  background-color: var(--k-purple-mid);
  border: 1px solid rgba(255, 255, 255, 0.16);
}

.context-role {
  font-size: 0.75rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #ffd166;
}

.context-user {
  font-size: 0.9375rem;
  font-weight: 700;
  color: #ffffff;
  margin-top: 2px;
}

.context-sub {
  font-size: 0.8125rem;
  color: #e4d8ff;
  margin-top: 2px;
}

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.nav-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  border: none;
  border-radius: var(--radius-sm);
  background: transparent;
  color: #ebe4ff;
  font-size: 0.9375rem;
  font-weight: 600;
  text-align: left;
  transition: background-color var(--t-fast), color var(--t-fast);
}

.nav-item:hover {
  background-color: rgba(255, 255, 255, 0.12);
  color: #ffffff;
}

.nav-item.active {
  background-color: #ffffff;
  color: var(--k-purple-dark);
  font-weight: 800;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
}

.sidebar-footer {
  padding: 14px 12px;
  border-top: 1px solid rgba(255, 255, 255, 0.14);
}

.main-area {
  min-width: 0;
  padding: 28px 36px 52px;
  max-width: 1380px;
}

.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.page-title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.625rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}

.page-subtitle {
  margin: 4px 0 0;
  font-size: 0.9375rem;
  color: var(--text-secondary);
}

/* Tabs */
.tabs-bar {
  display: flex;
  gap: 6px;
  border-bottom: 2px solid var(--border-subtle);
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.tab-btn {
  padding: 10px 18px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-family: var(--font-display);
  font-size: 0.9375rem;
  font-weight: 700;
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  transition: color var(--t-fast), border-color var(--t-fast);
}

.tab-btn:hover {
  color: var(--text-primary);
}

.tab-btn.active {
  color: var(--k-purple);
  border-bottom-color: var(--k-purple);
}

/* =========================================================================
   KAHOOT! PORTAL (PIN Entry, Login, Score Lookup)
   ========================================================================= */
.portal-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background-color: var(--k-purple);
  position: relative;
  overflow-x: hidden;
}

.portal-shell.portal-light {
  background-color: var(--bg-canvas);
}

/* Subtle flat Kahoot geometric background shapes on deep purple surfaces */
.kahoot-backdrop {
  position: relative;
  background-color: var(--k-purple);
  overflow: hidden;
}

.kahoot-backdrop-lobby {
  position: relative;
  background-color: var(--k-purple-dark);
  overflow: hidden;
}

.kahoot-geo {
  position: absolute;

  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.kahoot-geo-circle {
  position: absolute;
  width: 520px;
  height: 520px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.045);
  top: -180px;
  left: -140px;
}

.kahoot-geo-diamond {
  position: absolute;
  width: 440px;
  height: 440px;
  background: rgba(0, 0, 0, 0.14);
  transform: rotate(45deg);
  bottom: -210px;
  right: -120px;
}

.kahoot-geo-square {
  position: absolute;
  width: 240px;
  height: 240px;
  border-radius: 28px;
  background: rgba(255, 255, 255, 0.04);
  transform: rotate(18deg);
  top: 22%;
  right: 8%;
}

.portal-topbar {
  position: relative;
  z-index: 10;
  background-color: #ffffff;
  border-bottom: 1px solid var(--border-subtle);
  padding: 12px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.portal-nav-pills {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.portal-nav-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  border: 2px solid var(--border-subtle);
  background: #ffffff;
  color: var(--text-primary);
  font-family: var(--font-display);
  font-size: 0.875rem;
  font-weight: 700;
  transition: background-color var(--t-fast), border-color var(--t-fast), color var(--t-fast);
}

.portal-nav-pill:hover {
  background: #f5f0ff;
  border-color: var(--k-purple-border);
}

.portal-nav-pill.active {
  background: var(--k-purple);
  border-color: var(--k-purple);
  color: #ffffff;
}

.portal-main {
  position: relative;
  z-index: 2;
  flex: 1;
  width: 100%;
  max-width: 1140px;
  margin: 0 auto;
  padding: 36px 24px 60px;
}

.portal-pin-stage {
  display: grid;
  grid-template-columns: minmax(0, 440px) minmax(0, 1fr);
  gap: 32px;
  align-items: start;
  margin-top: 12px;
}

.pin-hero-card {
  background: #ffffff;
  border-radius: var(--radius-lg);
  padding: 28px 26px;
  box-shadow: var(--shadow-lg);
  border-bottom: 5px solid #d4d4d4;
}

.pin-brand-banner {
  text-align: center;
  margin-bottom: 20px;
}

.pin-brand-title {
  font-family: var(--font-display);
  font-size: 2.5rem;
  font-weight: 900;
  color: var(--k-purple);
  letter-spacing: -0.04em;
  margin: 0;
  line-height: 1;
}

.portal-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.02fr) minmax(0, 0.98fr);
  gap: 24px;
  align-items: start;
}

.sample-account-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.sample-account-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px;
  border: 2px solid var(--border-subtle);
  border-bottom-width: 4px;
  border-radius: var(--radius-sm);
  background: #ffffff;
  text-align: left;
  transition: border-color var(--t-fast), background-color var(--t-fast), transform 100ms ease;
}

.sample-account-btn:hover {
  border-color: var(--k-purple);
  background: #faf7ff;
}

.sample-account-btn:active {
  transform: translateY(1px);
}

/* =========================================================================
   KAHOOT! ANSWER TILES (2x2 Colored Geometry Grid)
   ========================================================================= */
.kahoot-answers-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.kahoot-opt {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 82px;
  padding: 14px 18px;
  border-radius: var(--radius-md);
  border: 2px solid transparent;
  border-bottom-width: 6px;
  cursor: pointer;
  user-select: none;
  text-align: left;
  transition: transform 110ms ease, filter var(--t-fast), opacity var(--t-fast), box-shadow var(--t-fast);
}

.kahoot-opt:hover {
  filter: brightness(1.04);
}

.kahoot-opt:active {
  transform: translateY(2px);
}

.kahoot-opt:focus-within {
  outline: 3px solid #1a1a1a;
  outline-offset: 2px;
}

.kahoot-opt.k-color-0 { background: var(--k-red);   border-bottom-color: var(--k-red-lip);   color: #ffffff; }
.kahoot-opt.k-color-1 { background: var(--k-blue);  border-bottom-color: var(--k-blue-lip);  color: #ffffff; }
.kahoot-opt.k-color-2 { background: var(--k-gold);  border-bottom-color: var(--k-gold-lip);  color: var(--k-gold-ink); }
.kahoot-opt.k-color-3 { background: var(--k-green); border-bottom-color: var(--k-green-lip); color: #ffffff; }
.kahoot-opt.k-color-4 { background: var(--k-teal);  border-bottom-color: var(--k-teal-lip);  color: #ffffff; }

.kahoot-opt.dimmed {
  opacity: 0.62;
}

.kahoot-opt.selected {
  opacity: 1;
  box-shadow: 0 0 0 3px #ffffff, 0 0 0 6px var(--k-purple-dark);
}

.k-shape-badge {
  width: 42px;
  height: 42px;
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.18);
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
}

.kahoot-opt.k-color-2 .k-shape-badge {
  background: rgba(28, 20, 0, 0.14);
}

.k-opt-letter {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 700;
  opacity: 0.9;
  display: block;
}

.k-opt-text {
  font-size: 1.0625rem;
  font-weight: 700;
  line-height: 1.35;
  flex: 1;
}

.k-opt-check {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2px solid currentColor;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
  background: rgba(255, 255, 255, 0.16);
}

.kahoot-opt.selected .k-opt-check {
  background: #ffffff;
  border-color: #ffffff;
  color: var(--k-purple-dark);
}

/* Compact Kahoot Pills in Bank / Editor / Result */
.k-mini-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.k-mini-opt {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border-subtle);
  background: #f9f9f9;
  font-size: 0.875rem;
}

.k-mini-opt.is-correct {
  border-color: var(--status-success-border);
  background: var(--status-success-bg);
  color: var(--status-success-text);
  font-weight: 700;
}

.k-mini-shape {
  width: 26px;
  height: 26px;
  border-radius: 5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
}
.k-mini-shape.k-color-0 { background: var(--k-red); color: #ffffff; }
.k-mini-shape.k-color-1 { background: var(--k-blue); color: #ffffff; }
.k-mini-shape.k-color-2 { background: var(--k-gold); color: var(--k-gold-ink); }
.k-mini-shape.k-color-3 { background: var(--k-green); color: #ffffff; }
.k-mini-shape.k-color-4 { background: var(--k-teal); color: #ffffff; }

/* Question Editor Studio Tiles */
.k-editor-tile {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border-bottom: 4px solid rgba(0, 0, 0, 0.22);
}
.k-editor-tile.k-color-0 { background: var(--k-red); color: #ffffff; }
.k-editor-tile.k-color-1 { background: var(--k-blue); color: #ffffff; }
.k-editor-tile.k-color-2 { background: var(--k-gold); color: var(--k-gold-ink); }
.k-editor-tile.k-color-3 { background: var(--k-green); color: #ffffff; }
.k-editor-tile.k-color-4 { background: var(--k-teal); color: #ffffff; }

.k-editor-input {
  flex: 1;
  min-width: 0;
  min-height: 38px;
  padding: 6px 10px;
  border-radius: 5px;
  border: 2px solid transparent;
  background: rgba(255, 255, 255, 0.96);
  color: var(--text-primary);
  font-weight: 600;
  font-size: 0.9375rem;
}
.k-editor-input:focus {
  outline: none;
  border-color: #1a1a1a;
}

.k-editor-toggle {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 3px solid #ffffff;
  background: rgba(0, 0, 0, 0.18);
  color: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  padding: 0;
}
.k-editor-tile.k-color-2 .k-editor-toggle {
  border-color: var(--k-gold-ink);
  color: var(--k-gold-ink);
  background: rgba(255, 255, 255, 0.45);
}
.k-editor-toggle.checked {
  background: #ffffff;
  color: var(--k-green);
  border-color: #ffffff;
}

/* =========================================================================
   STUDENT EXAM WORKSPACE (Full Kahoot Game-Exam Mode)
   ========================================================================= */
.exam-fullscreen-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background-color: var(--bg-canvas);
}

.exam-topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--k-purple-dark);
  color: #ffffff;
  padding: 12px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.16);
  flex-wrap: wrap;
}

.exam-timer {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 16px;
  border-radius: 999px;
  background: var(--k-purple);
  border: 2px solid rgba(255, 255, 255, 0.25);
  font-family: var(--font-mono);
  font-size: 1.25rem;
  font-weight: 700;
  color: #ffffff;
}

.exam-timer.urgent {
  background: var(--k-red);
  border-color: #ffffff;
  color: #ffffff;
}

.exam-body {
  flex: 1;
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: 24px 28px 48px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 310px;
  gap: 24px;
  align-items: start;
}

.exam-question-stage {
  background: #ffffff;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-subtle);
  border-bottom: 4px solid #d4d4d4;
  padding: 24px 26px;
  box-shadow: var(--shadow-card);
}

.q-nav-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
}

.q-nav-btn {
  height: 40px;
  border-radius: var(--radius-sm);
  border: 2px solid var(--border-subtle);
  border-bottom-width: 3px;
  background: #ffffff;
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 0.9375rem;
  color: var(--text-primary);
  position: relative;
}

.q-nav-btn.answered {
  background: var(--k-purple-tint);
  border-color: var(--k-purple-border);
  color: var(--k-purple);
}

.q-nav-btn.current {
  background: var(--k-purple);
  border-color: var(--k-purple-dark);
  color: #ffffff;
}

.q-nav-btn.flagged::after {
  content: "";
  position: absolute;
  top: 4px;
  right: 4px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--k-gold);
  border: 1px solid var(--k-gold-ink);
}

.question-media-frame {
  max-width: 520px;
  border: 2px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: #ffffff;
  padding: 10px;
  margin: 14px auto;
}

.question-media-frame img {
  object-fit: contain;
}

/* Live Room PIN Banner */
.live-pin-banner {
  background-color: var(--k-purple-dark);
  color: #ffffff;
  border-radius: var(--radius-lg);
  padding: 20px 26px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  flex-wrap: wrap;
  border-bottom: 5px solid #160345;
}

.live-pin-code {
  font-family: var(--font-mono);
  font-size: 1.875rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: #ffffff;
}

dialog.app-dialog {
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 0;
  width: min(700px, calc(100vw - 32px));

  box-shadow: var(--shadow-lg);
  background: var(--bg-surface);
  color: var(--text-primary);

dialog.app-dialog.dialog-wide {

}

dialog.app-dialog::backdrop {
  background: rgba(21, 5, 61, 0.58);
}

.dialog-inner {
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 48px);
}

.dialog-header {
  padding: 16px 24px;
  background: var(--k-purple-dark);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.dialog-title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.125rem;
  font-weight: 800;
}

.dialog-body {
  padding: 20px 24px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.dialog-footer {
  padding: 14px 24px;
  border-top: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  background: #f7f7f7;
}

/* Toasts */
.toast-stack {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 90;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 420px;
  pointer-events: none;
}

.toast {
  pointer-events: auto;
  background: var(--k-purple-dark);
  color: #ffffff;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  border-bottom: 4px solid #14023d;
  box-shadow: var(--shadow-lg);
  font-size: 0.9375rem;
  font-weight: 600;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.toast.toast-error {
  background: var(--k-red);
  border-bottom-color: var(--k-red-lip);
}

.toast.toast-warning {
  background: var(--k-gold);
  border-bottom-color: var(--k-gold-lip);
  color: var(--k-gold-ink);
}

.bar-track {
  width: 100%;
  height: 12px;
  border-radius: 999px;
  background: var(--bg-subtle);
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  border-radius: 999px;
  background: var(--k-red);
}

.empty-state {
  text-align: center;
  padding: 40px 24px;
  color: var(--text-secondary);
}

.empty-state-title {
  margin: 10px 0 4px;
  font-family: var(--font-display);
  font-size: 1.0625rem;
  font-weight: 800;
  color: var(--text-primary);
}

@media (max-width: 1024px) {
  .app-shell {
    grid-template-columns: 1fr;
  }
  .sidebar {
    position: static;
    height: auto;
  }
  .sidebar-nav {
    flex-direction: row;
    flex-wrap: wrap;
  }
  .nav-item {
    width: auto;
  }
  .portal-pin-stage, .portal-grid, .exam-body {
    grid-template-columns: 1fr;
  }
}

  .kahoot-answers-grid, .k-mini-grid {
    grid-template-columns: 1fr;
  }
  .main-area {
    padding: 20px 16px 40px;
  }
}

  function formatTimeClock(ts) {
    if (!ts) return '—';
    const d = new Date(ts);
    const pad = (n) => String(n).padStart(2, '0');
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  function formatDurationMMSS(totalSec) {
    const s = Math.max(0, Math.floor(totalSec));
    const mm = String(Math.floor(s / 60)).padStart(2, '0');
    const ss = String(s % 60).padStart(2, '0');
    return `${mm}:${ss}`;
  }

  function shuffleArray(arr) {
    const copy = arr.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function showToast(message, variant = 'info') {
    const container = document.getElementById('toast-container');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = `toast ${variant === 'error' ? 'toast-error' : variant === 'warning' ? 'toast-warning' : ''}`;
    const iconName = variant === 'error' ? 'alert' : variant === 'warning' ? 'alert' : 'checkCircle';
    toast.innerHTML = `${icon(iconName, 18)}<span>${escapeHtml(message)}</span>`;
    container.appendChild(toast);
    setTimeout(() => {
      toast.remove();
    }, 3800);
  }

  let lastTriggerEl = null;

  function openDialog({ title, bodyHtml, footerHtml, wide = false, onMount }) {
    const dialog = document.getElementById('app-dialog');
    if (!dialog) return;
    lastTriggerEl = document.activeElement;
    dialog.className = `app-dialog ${wide ? 'dialog-wide' : ''}`;
    dialog.innerHTML = `
      <div class="dialog-inner">
        <div class="dialog-header">
          <h2 id="dialog-title-node" class="dialog-title">${escapeHtml(title)}</h2>
          <button type="button" class="btn btn-sm btn-secondary" id="dialog-close-x" aria-label="Đóng hộp thoại">
            ${icon('x', 16)}
          </button>
        </div>
        <div class="dialog-body">${bodyHtml}</div>
        ${footerHtml ? `<div class="dialog-footer">${footerHtml}</div>` : ''}
      </div>
    `;
    const closeBtn = dialog.querySelector('#dialog-close-x');
    if (closeBtn) {
      closeBtn.addEventListener('click', closeDialog);
    }
    if (typeof dialog.showModal === 'function') {
      if (!dialog.open) dialog.showModal();
    } else {
      dialog.setAttribute('open', '');
    }
    if (onMount) onMount(dialog);
    const firstInput = dialog.querySelector('input, select, textarea, button:not(#dialog-close-x)');
    if (firstInput) firstInput.focus();
  }

  function closeDialog() {
    const dialog = document.getElementById('app-dialog');
    if (!dialog) return;
    if (typeof dialog.close === 'function' && dialog.open) {
      dialog.close();
    } else {
      dialog.removeAttribute('open');
    }
    dialog.innerHTML = '';
    if (lastTriggerEl && document.contains(lastTriggerEl)) {
      lastTriggerEl.focus();
    }
    lastTriggerEl = null;
  }

  /* =========================================================================

     ========================================================================= */
  function getSchool(schoolId) {
    return db.schools.find(s => s.id === schoolId) || null;
  }

  function getSubjectName(subjectId) {
    const s = db.subjects.find(x => x.id === subjectId);
    return s ? s.name : '—';
  }

  function getYearName(yearId) {
    const y = db.academicYears.find(x => x.id === yearId);
    return y ? y.name : '—';
  }

  function getCurrentYear(schoolId) {
    return db.academicYears.find(y => y.schoolId === schoolId && y.isCurrent)
      || db.academicYears.find(y => y.schoolId === schoolId)
      || null;
  }

  function getClass(classId) {
    return db.classes.find(c => c.id === classId) || null;
  }

  function getStudentClassInYear(student, yearId) {
    const enr = student.enrollments.find(e => e.academicYearId === yearId);
    return enr ? getClass(enr.classId) : null;
  }

  function getStudentsInClass(classId, yearId) {
    return db.students.filter(st =>
      st.enrollments.some(e => e.classId === classId && (!yearId || e.academicYearId === yearId))
    );
  }

  function getTeacherAssignedClasses(teacherId, yearId = null) {
    return db.assignments
      .filter(a => a.teacherId === teacherId && (!yearId || a.academicYearId === yearId))
      .map(a => getClass(a.classId))
      .filter(Boolean);
  }

  function isSameAnswerSet(selectedIds, correctIds) {
    if (!Array.isArray(selectedIds) || selectedIds.length === 0) return false;
    if (selectedIds.length !== correctIds.length) return false;
    const setA = new Set(selectedIds);
    return correctIds.every(id => setA.has(id));
  }

  function isQuestionCorrect(question, selectedIds) {
    const correctIds = question.options.filter(o => o.isCorrect).map(o => o.id);
    return isSameAnswerSet(selectedIds || [], correctIds);
  }

  function gradeAttempt(exam, attempt) {
    const total = exam.questionSnapshot.length;
    if (total === 0) return 0;
    let correctCount = 0;
    for (const q of exam.questionSnapshot) {
      const sel = attempt.answers[q.id] || [];
      if (isQuestionCorrect(q, sel)) correctCount++;
    }
    const raw = (correctCount / total) * 10;
    return Math.round(raw * 100) / 100;
  }

  function regradeExam(examId) {
    const exam = db.exams.find(e => e.id === examId);
    if (!exam) return 0;
    let count = 0;
    for (const att of db.attempts) {
      if (att.examId === examId && (att.status === 'submitted' || att.status === 'interrupted')) {
        att.score = gradeAttempt(exam, att);
        count++;
      }
    }
    return count;
  }

  function getStudentAttemptsForExam(examId, studentId) {
    return db.attempts
      .filter(a => a.examId === examId && a.studentId === studentId)
      .sort((a, b) => a.attemptNumber - b.attemptNumber);
  }

  function getOfficialScoreForExam(examId, studentId) {
    const scored = db.attempts.filter(
      a => a.examId === examId && a.studentId === studentId && typeof a.score === 'number'
    );
    if (scored.length === 0) return null;
    return Math.max(...scored.map(a => a.score));
  }

  function getUsedAttemptsCount(examId, studentId) {
    return db.attempts.filter(
      a => a.examId === examId && a.studentId === studentId && a.status !== 'waiting'
    ).length;
  }

  function hasCompletedExam(examId, studentId) {
    return db.attempts.some(
      a => a.examId === examId && a.studentId === studentId && a.status === 'submitted'
    );
  }

  function getStudentLiveStatus(examId, studentId) {
    const list = getStudentAttemptsForExam(examId, studentId);
    if (list.length === 0) return { code: 'not_started', label: 'Chưa làm', badge: 'badge-neutral' };
    const latest = list[list.length - 1];
    if (latest.status === 'submitted') return { code: 'submitted', label: 'Đã nộp', badge: 'badge-success' };
    if (latest.status === 'in_progress') return { code: 'in_progress', label: 'Đang làm', badge: 'badge-info' };
    if (latest.status === 'waiting') return { code: 'waiting', label: 'Đang chờ', badge: 'badge-warning' };
    if (latest.status === 'interrupted') return { code: 'interrupted', label: 'Gián đoạn', badge: 'badge-danger' };
    return { code: 'not_started', label: 'Chưa làm', badge: 'badge-neutral' };
  }

  function getDifficultyBadge(diff) {
    if (diff === 'easy') return '<span class="badge badge-success">Dễ</span>';
    if (diff === 'medium') return '<span class="badge badge-warning">Trung bình</span>';
    return '<span class="badge badge-danger">Khó</span>';
  }

  function getClassReleaseBadge(status) {
    if (status === 'released') return '<span class="badge badge-info"><span class="status-dot"></span>Đã phát đề</span>';
    if (status === 'closed') return '<span class="badge badge-danger"><span class="status-dot"></span>Đã thu bài</span>';
    return '<span class="badge badge-neutral"><span class="status-dot"></span>Chưa phát đề</span>';
  }

  function countExamAttempts(examId) {
    return db.attempts.filter(a => a.examId === examId && a.status !== 'waiting').length;
  }

  function getRemainingSeconds(attempt) {
    if (!attempt || !attempt.startedAt) return 0;
    const elapsed = Math.floor((Date.now() - attempt.startedAt) / 1000);
    return Math.max(0, attempt.durationSeconds - elapsed);
  }

  function clearExamTimer() {
    if (uiState.examTimerInterval) {
      clearInterval(uiState.examTimerInterval);
      uiState.examTimerInterval = null;
    }
  }

  function ensureExamTimer() {
    clearExamTimer();
    if (uiState.activeView !== 'st_exam' || !uiState.studentSession) return;
    uiState.examTimerInterval = setInterval(() => {
      if (uiState.activeView !== 'st_exam' || !uiState.studentSession) {
        clearExamTimer();
        return;
      }
      const att = db.attempts.find(a => a.id === uiState.studentSession.activeAttemptId);
      if (!att || att.status !== 'in_progress') {
        clearExamTimer();
        return;
      }
      const rem = getRemainingSeconds(att);
      const timerNode = document.getElementById('live-exam-timer');
      if (timerNode) {
        timerNode.textContent = formatDurationMMSS(rem);
        timerNode.className = `exam-timer ${rem <= 120 ? 'urgent' : ''}`;
      }
      if (rem <= 0) {
        clearExamTimer();
        finalizeStudentAttempt('Hết thời gian làm bài (tự động nộp)', true);
      }
    }, 1000);
  }

  function doStaffLogin(username, password) {

    if (!user) {
      uiState.loginError = 'Tên đăng nhập hoặc mật khẩu không chính xác.';
      render();
      return;

    if (user.schoolId) {

      if (!sch || sch.locked) {
        uiState.loginError = 'Trường học này hiện đang bị khóa. Không thể đăng nhập hoặc tổ chức thi.';
        render();
        return;
      }
    }
    uiState.loginError = '';
    uiState.currentUser = user;
    if (user.role === 'super_admin') uiState.activeView = 'sa_stats';
    else if (user.role === 'school_admin') {
      const curY = getCurrentYear(user.schoolId);
      uiState.scYearFilter = curY ? curY.id : '';
      uiState.scStudentYearFilter = curY ? curY.id : '';
      uiState.scAssignYearFilter = curY ? curY.id : '';
      uiState.activeView = 'sc_subjects';
    } else if (user.role === 'teacher') {
      const curY = getCurrentYear(user.schoolId);
      uiState.tcResultYearFilter = curY ? curY.id : '';
      uiState.tcStuYearFilter = curY ? curY.id : '';
      const myExams = db.exams.filter(e => e.teacherId === user.id);
      if (myExams.length > 0) {
        uiState.tcLiveExamId = myExams[0].id;
        uiState.tcLiveClassId = myExams[0].assignedClassIds[0] || '';
      }
      uiState.activeView = 'tc_bank';
    }
    render();
  }

  function logoutStaff() {
    uiState.currentUser = null;
    uiState.activeView = 'portal';
    uiState.portalTab = 'login';
    render();
  }

  function enterStudentExamFlow(examCodeRaw, studentCodeRaw) {
    const examCode = examCodeRaw.trim().toUpperCase().replace(/^.*\/EXAM\//i, '');
    const studentCode = studentCodeRaw.trim().toUpperCase();
    uiState.joinError = '';

    if (!examCode || !studentCode) {
      uiState.joinError = 'Vui lòng nhập đầy đủ Mã bài thi và Mã học sinh.';
      render();
      return;
    }

    const exam = db.exams.find(e => e.code.toUpperCase() === examCode);
    if (!exam) {
      uiState.joinError = `Không tìm thấy bài thi có mã "${examCode}".`;
      render();
      return;
    }

    const school = getSchool(exam.schoolId);
    if (!school || school.locked) {
      uiState.joinError = 'Trường tổ chức bài thi này hiện đang bị khóa. Không thể vào phòng thi.';
      render();
      return;
    }

    const student = db.students.find(
      s => s.schoolId === exam.schoolId && !s.anonymized && s.code.toUpperCase() === studentCode
    );
    if (!student) {
      uiState.joinError = 'Mã học sinh không tồn tại trong trường tổ chức bài thi này (hoặc đã bị vô hiệu hóa).';
      render();
      return;
    }

    const stuClass = getStudentClassInYear(student, exam.academicYearId);
    if (!stuClass || !exam.assignedClassIds.includes(stuClass.id)) {
      uiState.joinError = `Học sinh ${student.fullName} (${student.code}) không thuộc lớp được gán cho bài thi này.`;
      render();
      return;
    }

    const clsState = exam.classStates[stuClass.id];
    if (!clsState) {
      uiState.joinError = 'Lớp học chưa được cấu hình trạng thái thi.';
      render();
      return;
    }

    const activeOtherAttempt = db.attempts.find(
      a => a.studentId === student.id && a.status === 'in_progress' && a.examId !== exam.id
    );
    if (activeOtherAttempt) {
      const otherExam = db.exams.find(e => e.id === activeOtherAttempt.examId);
      uiState.joinError = `Mã học sinh ${student.code} đang làm bài thi "${otherExam ? otherExam.title : ''}". Theo quy định, một mã chỉ làm một bài tại một thời điểm.`;
      render();
      return;
    }

    const existingList = getStudentAttemptsForExam(exam.id, student.id);
    const completedAtt = existingList.find(a => a.status === 'submitted');
    if (completedAtt) {
      uiState.studentSession = {
        examId: exam.id,
        classId: stuClass.id,
        studentId: student.id,
        activeAttemptId: completedAtt.id,
        currentQIndex: 0,
        flaggedQIds: [],
        showAnswersOnResult: false,
        answerError: ''
      };
      uiState.activeView = 'st_result';
      render();
      return;
    }

    const activeSameAtt = existingList.find(a => a.status === 'in_progress');
    if (activeSameAtt) {
      openDialog({
        title: 'Phát hiện phiên làm bài đang mở ở thiết bị khác',
        bodyHtml: `
          <div class="alert alert-warning">
            ${icon('alert', 20)}
            <div>
              <strong>Mã học sinh ${escapeHtml(student.code)}</strong> hiện đang trong trạng thái làm bài tại một máy khác.
              Nếu tiếp tục trên máy này, máy cũ sẽ bị <strong>đăng xuất ngay lập tức</strong>, bài đang làm dở được chấm điểm và tính là <strong>1 lần gián đoạn</strong> (mất 1 lượt), sau đó bạn bắt đầu lượt mới tại phòng chờ.
            </div>
          </div>
        `,
        footerHtml: `
          <button type="button" class="btn btn-secondary" id="btn-cancel-push">Hủy</button>
          <button type="button" class="btn btn-primary" id="btn-confirm-push">Tiếp tục trên máy này (Đẩy máy cũ)</button>
        `,
        onMount: (dlg) => {
          dlg.querySelector('#btn-cancel-push').addEventListener('click', closeDialog);
          dlg.querySelector('#btn-confirm-push').addEventListener('click', () => {
            activeSameAtt.status = 'interrupted';
            activeSameAtt.endedAt = Date.now();
            activeSameAtt.endReason = 'Bị đẩy máy do đăng nhập từ thiết bị khác';
            activeSameAtt.score = gradeAttempt(exam, activeSameAtt);
            activeSameAtt.pushOutLogs.push({
              time: Date.now(),
              studentCode: student.code,
              detail: 'Đăng nhập từ máy thứ 2 khi đang làm bài, máy cũ bị đăng xuất'
            });
            closeDialog();
            proceedToWaitingRoom(exam, stuClass, student);
          });
        }
      });
      return;
    }

    proceedToWaitingRoom(exam, stuClass, student);
  }

  function proceedToWaitingRoom(exam, stuClass, student) {
    const clsState = exam.classStates[stuClass.id];
    const usedCount = getUsedAttemptsCount(exam.id, student.id);
    const maxAttempts = clsState.maxAttemptsSnap || 3;

    if (clsState.releaseStatus === 'closed') {
      uiState.joinError = 'Giáo viên đã đóng và thu bài cho lớp của bạn. Không thể vào thi mới.';
      render();
      return;
    }

    if (usedCount >= maxAttempts) {
      uiState.joinError = `Bạn đã sử dụng hết ${maxAttempts}/${maxAttempts} lần làm bài tối đa của trường.`;
      render();
      return;
    }

    let waitingAtt = db.attempts.find(
      a => a.examId === exam.id && a.studentId === student.id && a.status === 'waiting'
    );
    if (!waitingAtt) {
      waitingAtt = {
        id: uid('att'),
        examId: exam.id,
        classId: stuClass.id,
        studentId: student.id,
        attemptNumber: usedCount + 1,
        status: 'waiting',
        endReason: null,
        startedAt: null,
        endedAt: null,
        durationSeconds: exam.durationMinutes * 60,
        shuffledQuestionIds: [],
        optionOrders: {},
        answers: {},
        score: null,
        warningCount: 0,
        violationLogs: [],
        pushOutLogs: []
      };
      db.attempts.push(waitingAtt);
    }

    uiState.studentSession = {
      examId: exam.id,
      classId: stuClass.id,
      studentId: student.id,
      activeAttemptId: waitingAtt.id,
      currentQIndex: 0,
      flaggedQIds: [],
      showAnswersOnResult: false,
      answerError: ''
    };
    uiState.activeView = 'st_waiting';
    render();
  }

  function startStudentAttempt() {
    const sess = uiState.studentSession;
    if (!sess) return;
    const exam = db.exams.find(e => e.id === sess.examId);
    const clsState = exam && exam.classStates[sess.classId];
    if (!exam || !clsState) return;
    if (clsState.releaseStatus !== 'released') {
      showToast('Lớp của bạn chưa được phát đề hoặc đã thu bài.', 'warning');
      render();
      return;
    }

    const att = db.attempts.find(a => a.id === sess.activeAttemptId);
    if (!att) return;

    const qIds = shuffleArray(exam.questionSnapshot.map(q => q.id));
    const optOrders = {};
    for (const q of exam.questionSnapshot) {
      optOrders[q.id] = shuffleArray(q.options.map(o => o.id));
    }

    att.status = 'in_progress';
    att.startedAt = Date.now();
    att.durationSeconds = exam.durationMinutes * 60;
    att.shuffledQuestionIds = qIds;
    att.optionOrders = optOrders;
    att.answers = {};
    att.warningCount = 0;

    sess.currentQIndex = 0;
    sess.flaggedQIds = [];
    sess.showAnswersOnResult = false;
    sess.answerError = '';
    uiState.activeView = 'st_exam';

    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
    render();
    ensureExamTimer();
  }

  function finalizeStudentAttempt(reasonText, goToResult = true) {
    const sess = uiState.studentSession;
    if (!sess) return;
    const exam = db.exams.find(e => e.id === sess.examId);
    const att = db.attempts.find(a => a.id === sess.activeAttemptId);
    if (!exam || !att) return;

    clearExamTimer();
    if (document.fullscreenElement && document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    }

    att.status = goToResult ? 'submitted' : 'interrupted';
    att.endedAt = Date.now();
    att.endReason = reasonText;
    att.score = gradeAttempt(exam, att);

    if (goToResult) {
      sess.showAnswersOnResult = false;
      sess.answerError = '';
      uiState.activeView = 'st_result';
    } else {
      const clsState = exam.classStates[sess.classId];
      const maxAtt = (clsState && clsState.maxAttemptsSnap) || 3;
      const used = getUsedAttemptsCount(exam.id, sess.studentId);
      if (used < maxAtt && clsState && clsState.releaseStatus === 'released') {
        const nextWait = {
          id: uid('att'),
          examId: exam.id,
          classId: sess.classId,
          studentId: sess.studentId,
          attemptNumber: used + 1,
          status: 'waiting',
          endReason: null,
          startedAt: null,
          endedAt: null,
          durationSeconds: exam.durationMinutes * 60,
          shuffledQuestionIds: [],
          optionOrders: {},
          answers: {},
          score: null,
          warningCount: 0,
          violationLogs: [],
          pushOutLogs: []
        };
        db.attempts.push(nextWait);
        sess.activeAttemptId = nextWait.id;
        uiState.activeView = 'st_waiting';
        showToast('Phiên thi vừa bị gián đoạn quá 60 giây. Bạn đã được đưa về phòng chờ để bắt đầu lượt mới (không hiển thị điểm lần gián đoạn).', 'warning');
      } else {
        uiState.activeView = 'st_waiting';
        showToast('Phiên thi bị gián đoạn và bạn đã hết lượt làm bài hoặc lớp đã thu bài.', 'error');
      }
    }
    render();
  }

  function recordStudentViolation(typeLabel) {
    if (uiState.activeView !== 'st_exam' || !uiState.studentSession) return;
    const sess = uiState.studentSession;
    const exam = db.exams.find(e => e.id === sess.examId);
    const att = db.attempts.find(a => a.id === sess.activeAttemptId);
    if (!exam || !att || att.status !== 'in_progress') return;

    const clsState = exam.classStates[sess.classId];
    const maxWarnings = (clsState && clsState.maxWarningsSnap) || 2;
    att.warningCount += 1;

    if (att.warningCount > maxWarnings) {
      att.violationLogs.push({
        time: Date.now(),
        type: typeLabel,
        detail: `Vi phạm lần ${att.warningCount} (vượt ngưỡng ${maxWarnings}) — Hệ thống tự nộp bài`
      });
      showToast(`Vi phạm vượt quá ${maxWarnings} lần cảnh báo! Hệ thống đã tự động nộp bài.`, 'error');
      finalizeStudentAttempt(`Tự nộp bài do vi phạm quy chế (${typeLabel})`, true);
      return;
    }

    att.violationLogs.push({
      time: Date.now(),
      type: typeLabel,
      detail: `Cảnh báo lần ${att.warningCount}/${maxWarnings}`
    });

    openDialog({
      title: `Cảnh báo vi phạm quy chế thi (${att.warningCount}/${maxWarnings})`,
      bodyHtml: `
        <div class="alert alert-danger">
          ${icon('alert', 20)}
          <div>
            Hệ thống phát hiện hành vi: <strong>${escapeHtml(typeLabel)}</strong>.<br />
            Đây là cảnh báo lần <strong>${att.warningCount} / ${maxWarnings}</strong> cho lượt thi này.
            Nếu tiếp tục vi phạm thêm <strong>${maxWarnings - att.warningCount + 1}</strong> lần nữa, bài thi sẽ tự động nộp ngay lập tức.
          </div>
        </div>
      `,
      footerHtml: `<button type="button" class="btn btn-primary" id="btn-ack-warning">Tôi đã hiểu và tiếp tục làm bài</button>`,
      onMount: (dlg) => {
        dlg.querySelector('#btn-ack-warning').addEventListener('click', () => {
          closeDialog();
          if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
          }
        });
      }
    });
    render();
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && uiState.activeView === 'st_exam') {
      recordStudentViolation('Rời tab trình duyệt');
    }
  });

  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && uiState.activeView === 'st_exam') {
      const dialog = document.getElementById('app-dialog');
      if (!dialog || !dialog.open) {
        recordStudentViolation('Thoát chế độ toàn màn hình');
      }
    }
  });

  function exportClassScoresCSV(examId, classId) {
    const exam = db.exams.find(e => e.id === examId);
    const cls = getClass(classId);
    if (!exam || !cls) return;
    const students = getStudentsInClass(classId, exam.academicYearId);
    const rows = [
      ['Mã học sinh', 'Họ và tên', 'Điểm chính thức (cao nhất)', 'Số lần làm']
    ];
    for (const st of students) {
      const official = getOfficialScoreForExam(exam.id, st.id);
      const count = getUsedAttemptsCount(exam.id, st.id);
      rows.push([
        st.anonymized ? st.anonCode : st.code,
        st.anonymized ? '[Đã ẩn danh]' : st.fullName,
        official !== null ? official.toFixed(2) : 'Chưa có điểm',
        String(count)
      ]);
    }
    const csvContent = '\uFEFF' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `BangDiem_${exam.code}_${cls.name}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast(`Đã xuất bảng điểm lớp ${cls.name} (${rows.length - 1} học sinh) gồm Điểm chính thức và Số lần làm.`);
  }

  function renderPortalScoreLookup() {
    const schoolId = uiState.lookupSchoolId || db.schools[0]?.id || '';
    const schoolYears = db.academicYears.filter(y => y.schoolId === schoolId);
    if (!schoolYears.some(y => y.id === uiState.lookupYearId)) {
      const cur = getCurrentYear(schoolId);
      uiState.lookupYearId = cur ? cur.id : (schoolYears[0]?.id || '');
    }

    let lookupHtml = '';
    if (uiState.lookupSubmitted && uiState.lookupStudentCode.trim()) {
      const code = uiState.lookupStudentCode.trim().toUpperCase();
      const student = db.students.find(
        s => s.schoolId === schoolId && !s.anonymized && s.code.toUpperCase() === code
      );
      if (!student) {
        lookupHtml = `
          <div class="alert alert-warning" style="margin-top:20px">
            ${icon('alert', 18)}
            <div>Không tìm thấy dữ liệu điểm cho mã <strong class="mono">${escapeHtml(code)}</strong> tại trường đã chọn (mã không tồn tại hoặc đã bị vô hiệu hóa).</div>
          </div>
        `;
      } else {
        const yearId = uiState.lookupYearId;
        const stuClass = getStudentClassInYear(student, yearId);
        const publishedExams = stuClass
          ? db.exams.filter(e =>
              e.schoolId === schoolId &&
              e.academicYearId === yearId &&
              e.assignedClassIds.includes(stuClass.id) &&
              e.classStates[stuClass.id]?.scoresPublished === true
            )
          : [];

        lookupHtml = `
          <div style="margin-top:24px">
            <div class="alert alert-neutral" style="margin-bottom:16px">
              ${icon('lock', 18)}
              <div>
                Bảng điểm công khai năm học <strong>${escapeHtml(getYearName(yearId))}</strong> cho mã <strong class="mono">${escapeHtml(student.code)}</strong>.
                Màn hình tra cứu bảo mật tuyệt đối thông tin cá nhân (không hiển thị họ tên hay tên lớp).
              </div>
            </div>

            ${publishedExams.length === 0 ? `
              <div class="card card-pad empty-state">
                <div class="empty-state-title">Chưa có bài thi nào được công bố bảng điểm</div>
                <p>Trong năm học ${escapeHtml(getYearName(yearId))}, giáo viên chưa công bố bảng điểm cho bài thi nào của mã học sinh này.</p>
              </div>
            ` : `
              <div class="card">
                <div class="table-wrap">
                  <table class="data-table">
                    <thead>
                      <tr>
                        <th>Môn học</th>
                        <th>Bài thi</th>
                        <th>Mã bài thi</th>
                        <th>Điểm chính thức (cao nhất)</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${publishedExams.map(ex => {
                        const score = getOfficialScoreForExam(ex.id, student.id);
                        return `
                          <tr>
                            <td><span class="badge badge-brand">${escapeHtml(getSubjectName(ex.subjectId))}</span></td>
                            <td style="font-weight:700">${escapeHtml(ex.title)}</td>
                            <td class="mono">${escapeHtml(ex.code)}</td>
                            <td class="mono" style="font-size:1.125rem;font-weight:800;color:var(--k-purple)">
                              ${score !== null ? `${score.toFixed(2)} / 10` : 'Chưa dự thi'}
                            </td>
                          </tr>
                        `;
                      }).join('')}
                    </tbody>
                  </table>
                </div>
              </div>
            `}
          </div>
        `;
      }
    }

    return `
      <div style="margin-bottom:22px">
        <h1 class="page-title">Tra cứu điểm công khai</h1>
        <p class="page-subtitle">Chỉ hiển thị điểm chính thức cao nhất của các bài thi đã được giáo viên bấm công bố bảng điểm.</p>
      </div>

      <section class="card card-pad">
        <div class="od-grid" style="--od-cols:4;--od-gap:14px;align-items:end">
          <div class="field-group">
            <label class="field-label" for="sel-lookup-school">Trường học</label>
            <select id="sel-lookup-school" class="select">
              ${db.schools.map(s => `<option value="${s.id}" ${s.id === schoolId ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('')}
            </select>
          </div>
          <div class="field-group">
            <label class="field-label" for="inp-lookup-code">Mã học sinh / sinh viên</label>
            <input id="inp-lookup-code" class="input mono" type="text" value="${escapeHtml(uiState.lookupStudentCode)}" placeholder="Ví dụ: CVA25001" />
          </div>
          <div class="field-group">
            <label class="field-label" for="sel-lookup-year">Năm học</label>
            <select id="sel-lookup-year" class="select">
              ${schoolYears.map(y => `<option value="${y.id}" ${y.id === uiState.lookupYearId ? 'selected' : ''}>${escapeHtml(y.name)}${y.isCurrent ? ' (Hiện tại)' : ''}</option>`).join('')}
            </select>
          </div>
          <div>
            <button type="button" class="btn btn-primary" style="width:100%" id="btn-submit-lookup">
              ${icon('search', 18)} Tra cứu điểm
            </button>
          </div>
        </div>

        ${lookupHtml}
      </section>
    `;
  }

  function renderSCStudents() {
    const sid = uiState.currentUser.schoolId;
    const years = db.academicYears.filter(y => y.schoolId === sid);
    const yearId = years.some(y => y.id === uiState.scStudentYearFilter) ? uiState.scStudentYearFilter : (getCurrentYear(sid)?.id || years[0]?.id || '');
    uiState.scStudentYearFilter = yearId;

    const yearClasses = db.classes.filter(c => c.schoolId === sid && c.academicYearId === yearId);
    const clsFilter = uiState.scStudentClassFilter;
    const search = uiState.scStudentSearch.trim().toLowerCase();

    const students = db.students.filter(st => {
      if (st.schoolId !== sid) return false;
      if (!uiState.scShowAnonymized && st.anonymized) return false;
      const cls = getStudentClassInYear(st, yearId);
      if (!cls) return false;
      if (clsFilter && cls.id !== clsFilter) return false;
      if (search) {
        const hay = `${st.code} ${st.anonCode || ''} ${st.fullName} ${st.guardianName} ${st.guardianPhone}`.toLowerCase();
        if (!hay.includes(search)) return false;
      }
      return true;
    });

    return `
      <div class="page-header">
        <div>
          <h1 class="page-title">Quản lý học sinh / sinh viên</h1>
          <p class="page-subtitle">Xem đầy đủ thông tin cá nhân & người giám hộ, nhập danh sách từ file, chỉnh sửa và xóa tay ẩn danh hóa.</p>

          <button type="button" class="btn btn-secondary" id="btn-sc-import-students">${icon('upload', 17)} Nhập từ file</button>

        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="od-cluster" style="width:100%">
            <select id="sel-sc-stu-year" class="select" style="width:180px" aria-label="Năm học">
              ${years.map(y => `<option value="${y.id}" ${y.id === yearId ? 'selected' : ''}>Năm ${escapeHtml(y.name)}</option>`).join('')}
            </select>
            <select id="sel-sc-stu-class" class="select" style="width:160px" aria-label="Lớp học">
              <option value="">Tất cả lớp</option>
              ${yearClasses.map(c => `<option value="${c.id}" ${c.id === clsFilter ? 'selected' : ''}>Lớp ${escapeHtml(c.name)}</option>`).join('')}
            </select>
            <input id="inp-sc-stu-search" class="input" style="width:260px" type="search" value="${escapeHtml(uiState.scStudentSearch)}" placeholder="Tìm mã HS, họ tên, người giám hộ..." />
            <label class="od-row" style="font-size:0.875rem;margin-left:auto;cursor:pointer">
              <input type="checkbox" id="chk-sc-show-anon" ${uiState.scShowAnonymized ? 'checked' : ''} />
              Hiện hồ sơ đã ẩn danh
            </label>
          </div>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Mã HS</th>
                <th>Họ tên</th>
                <th>Lớp</th>
                <th>Ngày sinh & Quê quán</th>
                <th>Địa chỉ</th>
                <th>Người giám hộ</th>
                <th style="text-align:right">Thao tác</th>
              </tr>
            </thead>
            <tbody>
              ${students.length === 0 ? `
                <tr><td colspan="7" class="empty-state">Không có học sinh nào phù hợp điều kiện lọc.</td></tr>
              ` : students.map(st => {
                const cls = getStudentClassInYear(st, yearId);
                if (st.anonymized) {
                  return `
                    <tr>
                      <td class="mono"><span class="badge badge-neutral">${escapeHtml(st.anonCode)}</span></td>
                      <td colspan="4" style="color:var(--text-muted);font-style:italic">Dữ liệu cá nhân đã được xóa tay — Mã HS cũ đã vô hiệu hóa, điểm vẫn được bảo toàn.</td>

                      <td style="text-align:right">
                        <button type="button" class="btn btn-sm btn-subtle" data-sc-stu-history="${st.id}">Lịch sử lớp</button>
                      </td>
                    </tr>
                  `;
                }
                return `
                  <tr>
                    <td class="mono" style="font-weight:700">${escapeHtml(st.code)}</td>
                    <td style="font-weight:700">${escapeHtml(st.fullName)}</td>
                    <td><span class="badge badge-brand">${cls ? escapeHtml(cls.name) : '—'}</span></td>
                    <td>
                      <div>${escapeHtml(st.dob)}</div>
                      <div style="font-size:0.8125rem;color:var(--text-secondary)">${escapeHtml(st.hometown)}</div>
                    </td>
                    <td style="max-width:220px">${escapeHtml(st.address)}</td>
                    <td>
                      <div style="font-weight:600">${escapeHtml(st.guardianName)}</div>
                      <div class="mono" style="font-size:0.8125rem;color:var(--text-secondary)">${escapeHtml(st.guardianPhone)}</div>
                    </td>
                    <td style="text-align:right">
                      <div class="od-cluster" style="justify-content:flex-end">
                        <button type="button" class="btn btn-sm btn-subtle" data-sc-stu-history="${st.id}">Lịch sử</button>
                        <button type="button" class="btn btn-sm btn-secondary" data-sc-edit-stu="${st.id}">${icon('edit', 14)} Sửa</button>
                        <button type="button" class="btn btn-sm btn-danger-outline" data-sc-anon-stu="${st.id}">Xóa ẩn danh</button>
                      </div>
                    </td>

                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>

    const teachers = db.users.filter(u => u.role === 'teacher' && u.schoolId === sid);
    const gvFilter = uiState.scVaultTeacherFilter;
    const tab = uiState.scVaultTab;

    const questions = db.questions.filter(q => q.schoolId === sid && (gvFilter === 'all' || q.teacherId === gvFilter));
    const exams = db.exams.filter(e => e.schoolId === sid && (gvFilter === 'all' || e.teacherId === gvFilter));

    return `
      <div class="page-header">
        <div>
          <h1 class="page-title">Kho dữ liệu chỉ đọc của trường</h1>
          <p class="page-subtitle">Xem câu hỏi, đề thi và bảng điểm của giáo viên trong trường mình. Không có quyền chỉnh sửa hoặc truy cập trường khác.</p>
        </div>
        <span class="badge badge-neutral">${icon('eye', 14)} Chỉ đọc (Read-only)</span>
      </div>

      <div class="tabs-bar">
        <button type="button" class="tab-btn ${tab === 'questions' ? 'active' : ''}" data-sc-vault-tab="questions">Ngân hàng câu hỏi (${questions.length})</button>
        <button type="button" class="tab-btn ${tab === 'exams' ? 'active' : ''}" data-sc-vault-tab="exams">Đề thi & Bài thi (${exams.length})</button>
        <button type="button" class="tab-btn ${tab === 'scores' ? 'active' : ''}" data-sc-vault-tab="scores">Bảng điểm tổng hợp</button>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="od-row" style="gap:10px">
            <label for="sel-sc-vault-gv" class="field-label">Giáo viên:</label>
            <select id="sel-sc-vault-gv" class="select" style="width:260px">
              <option value="all">Tất cả giáo viên trong trường</option>
              ${teachers.map(t => `<option value="${t.id}" ${t.id === gvFilter ? 'selected' : ''}>${escapeHtml(t.fullName)} (${escapeHtml(getSubjectName(t.subjectId))})</option>`).join('')}
            </select>
          </div>
        </div>

        ${tab === 'questions' ? `
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Giáo viên & Môn</th>
                  <th>Độ khó</th>
                  <th>Nội dung câu hỏi & Đáp án đúng</th>
                </tr>
              </thead>
              <tbody>
                ${questions.map(q => {
                  const gv = db.users.find(u => u.id === q.teacherId);
                  const corrects = q.options.filter(o => o.isCorrect).map(o => o.text).join('; ');
                  return `
                    <tr>
                      <td style="white-space:nowrap">
                        <div style="font-weight:700">${gv ? escapeHtml(gv.fullName) : '—'}</div>
                        <span class="badge badge-brand">${escapeHtml(getSubjectName(q.subjectId))}</span>
                      </td>
                      <td>${getDifficultyBadge(q.difficulty)}</td>
                      <td>
                        <div style="font-weight:600">${escapeHtml(q.text)}</div>
                        <div style="font-size:0.875rem;color:var(--status-success-text);margin-top:4px">Đáp án đúng: <strong>${escapeHtml(corrects)}</strong></div>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        ` : tab === 'exams' ? `
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Tên bài thi</th>
                  <th>Mã</th>
                  <th>Giáo viên / Môn</th>
                  <th>Năm học</th>
                  <th>Số câu / Thời gian</th>
                </tr>
              </thead>
              <tbody>
                ${exams.map(ex => {
                  const gv = db.users.find(u => u.id === ex.teacherId);
                  return `
                    <tr>
                      <td style="font-weight:700">${escapeHtml(ex.title)}</td>
                      <td class="mono">${escapeHtml(ex.code)}</td>
                      <td>${gv ? escapeHtml(gv.fullName) : '—'} · ${escapeHtml(getSubjectName(ex.subjectId))}</td>
                      <td>${escapeHtml(getYearName(ex.academicYearId))}</td>
                      <td>${ex.questionSnapshot.length} câu · ${ex.durationMinutes} phút</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        ` : `
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Bài thi</th>
                  <th>Lớp</th>
                  <th>Học sinh</th>
                  <th>Số lần làm</th>
                  <th>Điểm chính thức</th>
                </tr>
              </thead>
              <tbody>
                ${exams.flatMap(ex => ex.assignedClassIds.flatMap(clsId => {
                  const cls = getClass(clsId);
                  const students = getStudentsInClass(clsId, ex.academicYearId);
                  return students.map(st => {
                    const count = getUsedAttemptsCount(ex.id, st.id);
                    const score = getOfficialScoreForExam(ex.id, st.id);
                    return `
                      <tr>
                        <td style="font-weight:600">${escapeHtml(ex.title)}</td>
                        <td><span class="badge badge-neutral">${cls ? escapeHtml(cls.name) : '—'}</span></td>
                        <td>${st.anonymized ? `<span class="mono">${escapeHtml(st.anonCode)}</span> [Ẩn danh]` : `${escapeHtml(st.fullName)} (<span class="mono">${escapeHtml(st.code)}</span>)`}</td>
                        <td class="num">${count}</td>
                        <td class="mono" style="font-weight:800;color:var(--k-purple)">${score !== null ? score.toFixed(2) : '—'}</td>
                      </tr>
                    `;
                  });
                })).join('')}
              </tbody>
            </table>
          </div>
        `}
      </div>
    `;
  }

  /* =========================================================================
     MODULE 3 & 4: TEACHER (Kahoot! Studio & Reports)
     ========================================================================= */
  function renderTeacherView() {
    const v = uiState.activeView;
    if (v === 'tc_bank') return renderTCBank();
    if (v === 'tc_exams') return renderTCExams();
    if (v === 'tc_live_room') return renderTCLiveRoom();
    if (v === 'tc_results') return renderTCResults();
    if (v === 'tc_attempt_detail') return renderTCAttemptDetail();
    return renderTCStudents();
  }

  function renderTCBank() {
    const user = uiState.currentUser;
    const allMyQ = db.questions.filter(q => q.teacherId === user.id);
    const easyCount = allMyQ.filter(q => q.difficulty === 'easy').length;
    const medCount = allMyQ.filter(q => q.difficulty === 'medium').length;
    const hardCount = allMyQ.filter(q => q.difficulty === 'hard').length;

    const search = uiState.tcBankSearch.trim().toLowerCase();
    const filtered = allMyQ.filter(q => {
      if (uiState.tcBankDiffFilter !== 'all' && q.difficulty !== uiState.tcBankDiffFilter) return false;
      if (search && !q.text.toLowerCase().includes(search)) return false;
      return true;
    });

    return `
      <div class="page-header">
        <div>
          <h1 class="page-title">Ngân hàng câu hỏi — Môn ${escapeHtml(getSubjectName(user.subjectId))}</h1>
          <p class="page-subtitle">Ngân hàng riêng của bạn, tái sử dụng qua nhiều năm học. Sửa hoặc xóa câu hỏi ở đây không làm thay đổi các đề thi đã rút trước đó.</p>
        </div>
        <button type="button" class="btn btn-primary" id="btn-tc-add-q">
          ${icon('plus', 18)} Tạo câu hỏi mới
        </button>
      </div>

      <div class="kpi-grid" style="margin-bottom:20px">
        <div class="kpi-card kpi-purple"><p class="kpi-label">Tổng câu hỏi</p><p class="kpi-value">${allMyQ.length}</p></div>
        <div class="kpi-card kpi-green"><p class="kpi-label">Mức độ Dễ</p><p class="kpi-value" style="color:var(--k-green)">${easyCount}</p></div>
        <div class="kpi-card kpi-gold"><p class="kpi-label">Mức độ Trung bình</p><p class="kpi-value" style="color:var(--status-warning-text)">${medCount}</p></div>
        <div class="kpi-card kpi-red"><p class="kpi-label">Mức độ Khó</p><p class="kpi-value" style="color:var(--k-red)">${hardCount}</p></div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="od-cluster">
            <button type="button" class="btn btn-sm ${uiState.tcBankDiffFilter === 'all' ? 'btn-primary' : 'btn-subtle'}" data-tc-diff="all">Tất cả (${allMyQ.length})</button>
            <button type="button" class="btn btn-sm ${uiState.tcBankDiffFilter === 'easy' ? 'btn-primary' : 'btn-subtle'}" data-tc-diff="easy">Dễ (${easyCount})</button>
            <button type="button" class="btn btn-sm ${uiState.tcBankDiffFilter === 'medium' ? 'btn-primary' : 'btn-subtle'}" data-tc-diff="medium">Trung bình (${medCount})</button>
            <button type="button" class="btn btn-sm ${uiState.tcBankDiffFilter === 'hard' ? 'btn-primary' : 'btn-subtle'}" data-tc-diff="hard">Khó (${hardCount})</button>
          </div>
          <input id="inp-tc-bank-search" class="input" style="width:280px" type="search" value="${escapeHtml(uiState.tcBankSearch)}" placeholder="Tìm nội dung câu hỏi..." />
        </div>

        <div class="od-stack" style="padding:18px 24px;--od-gap:16px">
          ${filtered.length === 0 ? `
            <div class="empty-state">
              <div class="empty-state-title">Chưa có câu hỏi nào phù hợp</div>
              <p>Hãy bấm "Tạo câu hỏi mới" để thêm câu hỏi trắc nghiệm vào ngân hàng môn ${escapeHtml(getSubjectName(user.subjectId))}.</p>
            </div>
          ` : filtered.map((q, idx) => `
            <div class="card" style="padding:18px 20px">
              <div class="od-row-top" style="justify-content:space-between;gap:16px">
                <div class="od-fill">
                  <div class="od-cluster" style="margin-bottom:8px">
                    <span class="badge badge-brand mono">#${idx + 1}</span>
                    ${getDifficultyBadge(q.difficulty)}
                    <span class="badge badge-neutral">${q.multiSelect ? 'Nhiều đáp án đúng' : '1 đáp án đúng'}</span>
                    ${q.image ? `<span class="badge badge-info">${icon('image', 13)} Có hình ảnh</span>` : ''}
                  </div>
                  <div style="font-weight:700;font-size:1.0625rem;margin-bottom:10px">${escapeHtml(q.text)}</div>
                  ${q.image ? `
                    <div class="question-media-frame" style="max-width:360px;margin:10px 0">
                      <img class="od-media" src="${escapeHtml(q.image.uri)}" width="${q.image.width}" height="${q.image.height}" alt="${escapeHtml(q.image.alt || 'Hình minh họa câu hỏi')}" style="--od-ratio:${q.image.width}/${q.image.height}" />
                    </div>
                  ` : ''}
                  <div class="k-mini-grid" style="margin-top:10px">
                    ${q.options.map((o, oi) => `
                      <div class="k-mini-opt ${o.isCorrect ? 'is-correct' : ''}">
                        <span class="k-mini-shape k-color-${kahootColorIdx(oi)}">${kahootShape(oi, 14)}</span>
                        <span class="od-fill"><strong>${String.fromCharCode(65 + oi)}.</strong> ${escapeHtml(o.text)}</span>
                        ${o.isCorrect ? `${icon('check', 16)}` : ''}
                      </div>
                    `).join('')}
                  </div>
                </div>
                <div class="od-cluster od-fixed">
                  <button type="button" class="btn btn-sm btn-secondary" data-tc-edit-q="${q.id}">${icon('edit', 14)} Sửa</button>
                  <button type="button" class="btn btn-sm btn-danger-outline" data-tc-del-q="${q.id}">${icon('trash', 14)} Xóa</button>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

                    <td>
                      <div style="font-weight:700">${ex.questionSnapshot.length} câu cố định</div>
                      <div style="font-size:0.8125rem;color:var(--text-secondary)">Dễ: ${ex.drawConfig.easy} · TB: ${ex.drawConfig.medium} · Khó: ${ex.drawConfig.hard}</div>
