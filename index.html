  function renderTCLiveRoom() {
    const user = uiState.currentUser;
    const myExams = db.exams.filter(e => e.teacherId === user.id);
    if (myExams.length === 0) {
      return `
        <div class="page-header"><div><h1 class="page-title">Phòng thi & Điều khiển trực tiếp</h1></div></div>
        <div class="card card-pad empty-state"><div class="empty-state-title">Chưa có bài thi nào</div><p>Hãy tạo bài thi trước khi mở phòng thi.</p></div>
      `;
    }

    const exam = myExams.find(e => e.id === uiState.tcLiveExamId) || myExams[0];
    uiState.tcLiveExamId = exam.id;
    const classId = exam.assignedClassIds.includes(uiState.tcLiveClassId) ? uiState.tcLiveClassId : exam.assignedClassIds[0];
    uiState.tcLiveClassId = classId;

    const cls = getClass(classId);
    const clsState = exam.classStates[classId];
    const students = cls ? getStudentsInClass(cls.id, exam.academicYearId) : [];

    const statuses = students.map(st => ({ student: st, status: getStudentLiveStatus(exam.id, st.id), attempts: getStudentAttemptsForExam(exam.id, st.id) }));
    const countWait = statuses.filter(x => x.status.code === 'waiting').length;
    const countDoing = statuses.filter(x => x.status.code === 'in_progress').length;
    const countDone = statuses.filter(x => x.status.code === 'submitted').length;
    const countNot = statuses.filter(x => x.status.code === 'not_started').length;

    return `
      <div class="page-header">
        <div>
          <h1 class="page-title">Phòng thi & Điều khiển trực tiếp theo lớp</h1>
          <p class="page-subtitle">Phát đề, đóng/thu bài, theo dõi trạng thái học sinh và công bố đáp án, bảng điểm độc lập cho từng lớp.</p>
        </div>
      </div>

      <div class="live-pin-banner">
        <div>
          <div style="font-size:0.8125rem;font-weight:700;color:#e4d8ff;text-transform:uppercase;letter-spacing:0.05em">Mã PIN phòng thi</div>
          <div class="live-pin-code">${escapeHtml(exam.code)}</div>
        </div>
        <div class="od-cluster">
          <button type="button" class="btn btn-secondary" data-copy-exam-code="${escapeHtml(exam.code)}">${icon('copy', 16)} Sao chép mã PIN</button>
        </div>
      </div>

      <div class="card card-pad" style="margin-bottom:20px">
        <div class="od-grid" style="--od-cols:2;--od-gap:16px;margin-bottom:16px">
          <div class="field-group">
            <label class="field-label" for="sel-live-exam">Chọn bài thi</label>
            <select id="sel-live-exam" class="select">
              ${myExams.map(e => `<option value="${e.id}" ${e.id === exam.id ? 'selected' : ''}>${escapeHtml(e.title)} (${escapeHtml(e.code)})</option>`).join('')}
            </select>
          </div>
          <div class="field-group">
            <label class="field-label" for="sel-live-class">Chọn lớp điều khiển (từng lớp riêng biệt)</label>
            <select id="sel-live-class" class="select">
              ${exam.assignedClassIds.map(cid => {
                const c = getClass(cid);
                const st = exam.classStates[cid];
                return `<option value="${cid}" ${cid === classId ? 'selected' : ''}>Lớp ${c ? escapeHtml(c.name) : cid} — ${st?.releaseStatus === 'released' ? 'Đã phát đề' : st?.releaseStatus === 'closed' ? 'Đã thu bài' : 'Chưa phát đề'}</option>`;
              }).join('')}
            </select>
          </div>
        </div>

        <div class="od-row" style="justify-content:space-between;flex-wrap:wrap;gap:12px;padding-top:14px;border-top:1px solid var(--border-subtle)">
          <div class="od-cluster">
            <span>Trạng thái lớp <strong>${cls ? escapeHtml(cls.name) : ''}</strong>:</span>
            ${getClassReleaseBadge(clsState.releaseStatus)}
            <span class="badge badge-neutral">Quy chế áp dụng: ${clsState.maxAttemptsSnap} lượt · ${clsState.maxWarningsSnap} cảnh báo</span>
          </div>

          <div class="od-cluster">
            ${clsState.releaseStatus === 'draft' ? `
              <button type="button" class="btn btn-success" id="btn-live-release">${icon('play', 16)} Phát đề cho lớp ${cls ? escapeHtml(cls.name) : ''}</button>
            ` : clsState.releaseStatus === 'released' ? `
              <button type="button" class="btn btn-danger" id="btn-live-close">${icon('stop', 16)} Đóng / Thu bài lớp ${cls ? escapeHtml(cls.name) : ''}</button>
            ` : `
              <span class="badge badge-danger">Lớp đã đóng và thu bài</span>
            `}

            <button type="button" class="btn ${clsState.answersPublished ? 'btn-success' : 'btn-secondary'}" id="btn-live-pub-ans">
              ${icon(clsState.answersPublished ? 'check' : 'eye', 16)}
              ${clsState.answersPublished ? 'Đã công bố đáp án' : 'Công bố đáp án'}
            </button>

            <button type="button" class="btn ${clsState.scoresPublished ? 'btn-success' : 'btn-secondary'}" id="btn-live-pub-scores">
              ${icon(clsState.scoresPublished ? 'check' : 'award', 16)}
              ${clsState.scoresPublished ? 'Đã công bố bảng điểm' : 'Công bố bảng điểm'}
            </button>
          </div>
        </div>
      </div>

      <div class="kpi-grid" style="margin-bottom:20px">
        <div class="kpi-card kpi-gold"><p class="kpi-label">Đang chờ (Phòng chờ)</p><p class="kpi-value" style="color:var(--status-warning-text)">${countWait}</p></div>
        <div class="kpi-card kpi-blue"><p class="kpi-label">Đang làm bài</p><p class="kpi-value" style="color:var(--k-blue)">${countDoing}</p></div>
        <div class="kpi-card kpi-green"><p class="kpi-label">Đã nộp bài</p><p class="kpi-value" style="color:var(--k-green)">${countDone}</p></div>
        <div class="kpi-card"><p class="kpi-label">Chưa vào thi</p><p class="kpi-value" style="color:var(--text-secondary)">${countNot}</p></div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Trạng thái trực tiếp học sinh lớp ${cls ? escapeHtml(cls.name) : ''} (${students.length} em)</h2>
          <span class="badge badge-info"><span class="status-dot"></span>Cập nhật trực tiếp</span>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Mã HS</th>
                <th>Họ tên</th>
                <th>Trạng thái</th>
                <th>Lượt làm</th>
                <th>Cảnh báo</th>
                <th>Điểm cao nhất</th>
                <th style="text-align:right">Chi tiết</th>
              </tr>

              ${statuses.map(({ student: st, status, attempts }) => {
                const latest = attempts[attempts.length - 1];
                const official = getOfficialScoreForExam(exam.id, st.id);
                const maxW = clsState.maxWarningsSnap || 2;
                const used = getUsedAttemptsCount(exam.id, st.id);
                return `
                  <tr>
                    <td class="mono">${st.anonymized ? escapeHtml(st.anonCode) : escapeHtml(st.code)}</td>
                    <td style="font-weight:700">${st.anonymized ? '<span style="color:var(--text-muted)">[Đã ẩn danh]</span>' : escapeHtml(st.fullName)}</td>
                    <td><span class="badge ${status.badge}"><span class="status-dot"></span>${status.label}</span></td>
                    <td class="num">${used} / ${clsState.maxAttemptsSnap}</td>
                    <td>${latest ? `<span class="num ${latest.warningCount > 0 ? 'badge badge-warning' : ''}">${latest.warningCount}/${maxW}</span>` : '—'}</td>
                    <td class="mono" style="font-weight:800;color:var(--k-purple)">${official !== null ? official.toFixed(2) : '—'}</td>
                    <td style="text-align:right">
                      <button type="button" class="btn btn-sm btn-secondary" data-tc-open-detail="${exam.id}|${st.id}" ${attempts.length === 0 ? 'disabled' : ''}>

                      </button>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;

  function renderTCResults() {
    const user = uiState.currentUser;
    const schoolYears = db.academicYears.filter(y => y.schoolId === user.schoolId);
    const yearId = schoolYears.some(y => y.id === uiState.tcResultYearFilter)
      ? uiState.tcResultYearFilter
      : (getCurrentYear(user.schoolId)?.id || schoolYears[0]?.id || '');
    uiState.tcResultYearFilter = yearId;

    const assignedClasses = getTeacherAssignedClasses(user.id, yearId);
    const classId = assignedClasses.some(c => c.id === uiState.tcResultClassId)
      ? uiState.tcResultClassId
      : (assignedClasses[0]?.id || '');
    uiState.tcResultClassId = classId;

    const exams = db.exams.filter(e =>
      e.teacherId === user.id &&
      e.academicYearId === yearId &&
      (!classId || e.assignedClassIds.includes(classId))
    );
    const exam = exams.find(e => e.id === uiState.tcResultExamId) || exams[0] || null;
    uiState.tcResultExamId = exam ? exam.id : '';

    return `
      <div class="page-header">
        <div>
          <h1 class="page-title">Kết quả, Thống kê & Chấm lại</h1>
          <p class="page-subtitle">Xem bảng điểm lớp được phân công (FR-060), thống kê câu sai nhiều, sửa đáp án trên bản sao đề để chấm lại tự động và xuất Excel.</p>
        </div>
        ${exam && classId ? `
          <button type="button" class="btn btn-success" id="btn-tc-export-excel">
            ${icon('download', 17)} Xuất Excel bảng điểm
          </button>
        ` : ''}
      </div>

      <div class="card card-pad" style="margin-bottom:20px">
        <div class="od-grid" style="--od-cols:3;--od-gap:16px">
          <div class="field-group">
            <label class="field-label" for="sel-res-year">Năm học phân công</label>
            <select id="sel-res-year" class="select">
              ${schoolYears.map(y => `<option value="${y.id}" ${y.id === yearId ? 'selected' : ''}>${escapeHtml(y.name)}${y.isCurrent ? ' (Hiện tại)' : ''}</option>`).join('')}
            </select>
          </div>
          <div class="field-group">
            <label class="field-label" for="sel-res-class">Lớp được phân công</label>
            <select id="sel-res-class" class="select">
              ${assignedClasses.length === 0 ? '<option value="">Không có lớp được phân công</option>' : assignedClasses.map(c => `<option value="${c.id}" ${c.id === classId ? 'selected' : ''}>Lớp ${escapeHtml(c.name)}</option>`).join('')}
            </select>
          </div>
          <div class="field-group">
            <label class="field-label" for="sel-res-exam">Bài thi</label>
            <select id="sel-res-exam" class="select">
              ${exams.length === 0 ? '<option value="">Chưa có bài thi cho lớp này</option>' : exams.map(e => `<option value="${e.id}" ${exam && e.id === exam.id ? 'selected' : ''}>${escapeHtml(e.title)}</option>`).join('')}
            </select>
          </div>
        </div>
      </div>

      ${!exam || !classId ? `
        <div class="card card-pad empty-state">
          <div class="empty-state-title">Chưa có dữ liệu kết quả trong lựa chọn này</div>
          <p>Hãy chọn năm học và lớp bạn được phân công có bài thi đã tạo.</p>
        </div>
      ` : renderTCResultsBody(exam, classId)}
    `;
  }

  function renderTCResultsBody(exam, classId) {
    const tab = uiState.tcResultTab;
    const students = getStudentsInClass(classId, exam.academicYearId);
    const clsState = exam.classStates[classId];

    const classStudentIds = new Set(students.map(s => s.id));
    const relevantAttempts = db.attempts.filter(
      a => a.examId === exam.id && classStudentIds.has(a.studentId) && (a.status === 'submitted' || a.status === 'interrupted')
    );

    return `
      <div class="tabs-bar">
        <button type="button" class="tab-btn ${tab === 'scores' ? 'active' : ''}" data-res-tab="scores">Bảng điểm cả lớp (${students.length})</button>
        <button type="button" class="tab-btn ${tab === 'wrong_stats' ? 'active' : ''}" data-res-tab="wrong_stats">Thống kê câu hay sai</button>
        <button type="button" class="tab-btn ${tab === 'regrade' ? 'active' : ''}" data-res-tab="regrade">Sửa đáp án & Chấm lại tự động</button>
      </div>

      ${tab === 'scores' ? `
        <div class="card">
          <div class="card-header">
            <div class="od-cluster">
              <h2 class="card-title">Bảng điểm lớp ${escapeHtml(getClass(classId)?.name || '')}</h2>
              ${clsState?.scoresPublished ? '<span class="badge badge-success">Đã công bố bảng điểm</span>' : '<span class="badge badge-neutral">Chưa công bố bảng điểm</span>'}
            </div>
            <span class="field-hint">Xuất Excel chỉ gồm Điểm chính thức (cao nhất) và Số lần làm (FR-062).</span>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Mã HS</th>
                  <th>Họ tên</th>
                  <th>Số lần làm</th>
                  <th>Chi tiết các lần</th>
                  <th>Điểm chính thức (cao nhất)</th>
                  <th style="text-align:right">Bài làm & Nhật ký</th>
                </tr>
              </thead>
              <tbody>
                ${students.map(st => {
                  const atts = getStudentAttemptsForExam(exam.id, st.id).filter(a => a.status !== 'waiting');
                  const official = getOfficialScoreForExam(exam.id, st.id);
                  return `
                    <tr>
                      <td class="mono">${st.anonymized ? escapeHtml(st.anonCode) : escapeHtml(st.code)}</td>
                      <td style="font-weight:700">${st.anonymized ? '<span style="color:var(--text-muted)">[Đã xóa thông tin cá nhân]</span>' : escapeHtml(st.fullName)}</td>
                      <td class="num">${atts.length}</td>
                      <td>
                        ${atts.length === 0 ? '<span style="color:var(--text-muted)">Chưa thi</span>' : atts.map(a => `
                          <span class="badge ${a.status === 'submitted' ? 'badge-success' : a.status === 'interrupted' ? 'badge-warning' : 'badge-info'}">
                            L${a.attemptNumber}: ${typeof a.score === 'number' ? a.score.toFixed(2) : 'Đang làm'}
                          </span>
                        `).join(' ')}
                      </td>
                      <td class="mono" style="font-size:1.125rem;font-weight:800;color:var(--k-purple)">
                        ${official !== null ? `${official.toFixed(2)} / 10` : '—'}
                      </td>
                      <td style="text-align:right">
                        <button type="button" class="btn btn-sm btn-secondary" data-tc-open-detail="${exam.id}|${st.id}" ${atts.length === 0 ? 'disabled' : ''}>
                          Xem chi tiết
                        </button>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      ` : tab === 'wrong_stats' ? `
        <div class="card card-pad">
          <h2 class="card-title" style="margin-bottom:6px">Thống kê tỷ lệ làm sai theo từng câu hỏi</h2>
          <p class="field-hint" style="margin-bottom:18px">Tính trên ${relevantAttempts.length} lượt bài đã chấm của lớp ${escapeHtml(getClass(classId)?.name || '')}. Sắp xếp theo tỷ lệ sai giảm dần.</p>

          ${relevantAttempts.length === 0 ? `
            <div class="empty-state"><div class="empty-state-title">Chưa có bài thi đã chấm</div><p>Cần ít nhất 1 lượt làm bài được chấm để thống kê.</p></div>
          ` : `
            <div class="od-stack" style="--od-gap:14px">
              ${exam.questionSnapshot.map((q, idx) => {
                let wrong = 0;
                for (const att of relevantAttempts) {
                  if (!isQuestionCorrect(q, att.answers[q.id])) wrong++;
                }
                const pct = Math.round((wrong / relevantAttempts.length) * 100);
                return { q, idx, wrong, pct };
              }).sort((a, b) => b.pct - a.pct).map(item => `
                <div style="padding:14px 16px;border:1.5px solid var(--border-subtle);border-radius:var(--radius-sm)">
                  <div class="od-row" style="justify-content:space-between;margin-bottom:8px">
                    <div class="od-cluster">
                      <span class="badge badge-brand mono">Câu ${item.idx + 1}</span>
                      ${getDifficultyBadge(item.q.difficulty)}
                    </div>
                    <div class="num" style="font-weight:800;color:${item.pct >= 50 ? 'var(--k-red)' : 'var(--text-primary)'}">
                      ${item.wrong}/${relevantAttempts.length} lượt sai (${item.pct}%)
                    </div>
                  </div>
                  <div style="margin-bottom:10px;font-weight:600">${escapeHtml(item.q.text)}</div>
                  <div class="bar-track" aria-hidden="true"><div class="bar-fill" style="width:${item.pct}%"></div></div>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      ` : `
        <div class="card card-pad">
          <div class="od-row" style="justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px">
            <div>
              <h2 class="card-title">Sửa đáp án trên bản sao đề thi & Chấm lại tự động</h2>
              <p class="field-hint">Chỉ sửa trên bản sao cố định của đề thi này (không làm thay đổi ngân hàng câu hỏi). Lựa chọn của học sinh giữ nguyên, điểm sẽ được tính lại và tự cập nhật trên tra cứu điểm.</p>
            </div>
            <button type="button" class="btn btn-primary" id="btn-tc-save-regrade">
              ${icon('checkCircle', 17)} Lưu đáp án mới & Chấm lại tất cả bài
            </button>
          </div>

          <div class="od-stack" style="--od-gap:16px">
            ${exam.questionSnapshot.map((q, idx) => `
              <div style="padding:16px;border:1.5px solid var(--border-subtle);border-radius:var(--radius-sm)">
                <div class="od-cluster" style="margin-bottom:8px">
                  <span class="badge badge-brand mono">Câu ${idx + 1}</span>
                  ${getDifficultyBadge(q.difficulty)}
                  <span class="badge badge-neutral">${q.multiSelect ? 'Nhiều đáp án đúng' : '1 đáp án đúng'}</span>
                </div>
                <div style="font-weight:700;margin-bottom:12px">${escapeHtml(q.text)}</div>
                <div class="k-mini-grid">
                  ${q.options.map((o, oi) => `
                    <label class="k-mini-opt ${o.isCorrect ? 'is-correct' : ''}" style="cursor:pointer">
                      <input type="${q.multiSelect ? 'checkbox' : 'radio'}" name="regrade_${q.id}" data-regrade-q="${q.id}" value="${o.id}" ${o.isCorrect ? 'checked' : ''} />
                      <span class="k-mini-shape k-color-${kahootColorIdx(oi)}">${kahootShape(oi, 14)}</span>
                      <span class="od-fill"><strong>${String.fromCharCode(65 + oi)}.</strong> ${escapeHtml(o.text)}</span>
                    </label>
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `}
    `;
  }

  function renderTCAttemptDetail() {
    const exam = db.exams.find(e => e.id === uiState.tcDetailExamId);
    const student = db.students.find(s => s.id === uiState.tcDetailStudentId);
    if (!exam || !student) {
      uiState.activeView = 'tc_results';
      return renderTCResults();
    }

    const attempts = getStudentAttemptsForExam(exam.id, student.id);
    const official = getOfficialScoreForExam(exam.id, student.id);

    return `
      <div class="page-header">
        <div>
          <button type="button" class="btn btn-subtle btn-sm" id="btn-tc-back-results" style="margin-bottom:10px">
            ${icon('arrowLeft', 15)} Quay lại bảng điểm
          </button>
          <h1 class="page-title">Chi tiết bài làm & Nhật ký vi phạm</h1>
          <p class="page-subtitle">
            Học sinh: <strong>${student.anonymized ? escapeHtml(student.anonCode) + ' [Đã ẩn danh]' : `${escapeHtml(student.fullName)} (${escapeHtml(student.code)})`}</strong>
            · Bài thi: <strong>${escapeHtml(exam.title)}</strong>
          </p>
        </div>
        <div class="card card-pad" style="padding:12px 20px">
          <div style="font-size:0.8125rem;color:var(--text-muted);font-weight:700">Điểm chính thức (cao nhất)</div>
          <div class="mono" style="font-size:1.625rem;font-weight:800;color:var(--k-purple)">${official !== null ? `${official.toFixed(2)} / 10` : '—'}</div>
        </div>
      </div>

      <div class="od-stack" style="--od-gap:20px">
        ${attempts.map(att => {
          const logs = [
            ...att.violationLogs.map(v => ({ time: v.time, kind: 'Vi phạm quy chế', title: v.type, detail: v.detail, badge: 'badge-danger' })),
            ...att.pushOutLogs.map(p => ({ time: p.time, kind: 'Đẩy máy (FR-043)', title: `Mã ${p.studentCode}`, detail: p.detail, badge: 'badge-warning' }))
          ].sort((a, b) => a.time - b.time);

          return `
            <section class="card card-pad">
              <div class="od-row" style="justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border-subtle)">
                <div class="od-cluster">
                  <span style="font-size:1.125rem;font-weight:800">Lần làm #${att.attemptNumber}</span>
                  <span class="badge ${att.status === 'submitted' ? 'badge-success' : att.status === 'interrupted' ? 'badge-warning' : att.status === 'in_progress' ? 'badge-info' : 'badge-neutral'}">
                    ${att.status === 'submitted' ? 'Hoàn thành' : att.status === 'interrupted' ? 'Gián đoạn' : att.status === 'in_progress' ? 'Đang làm' : 'Đang chờ'}
                  </span>
                  ${att.endReason ? `<span style="font-size:0.875rem;color:var(--text-secondary)">— ${escapeHtml(att.endReason)}</span>` : ''}
                </div>
                <div class="od-cluster">
                  <span style="font-size:0.875rem;color:var(--text-secondary)">Bắt đầu: <strong class="mono">${formatTimeClock(att.startedAt)}</strong></span>
                  <span style="font-size:0.875rem;color:var(--text-secondary)">Kết thúc: <strong class="mono">${formatTimeClock(att.endedAt)}</strong></span>
                  <span class="badge badge-brand mono" style="font-size:0.9375rem">${typeof att.score === 'number' ? `${att.score.toFixed(2)} điểm` : 'Chưa chấm'}</span>
                </div>
              </div>

              <div class="od-grid" style="--od-cols:12;--od-gap:20px">
                <div style="grid-column:span 7">
                  <h3 style="margin:0 0 10px;font-size:0.9375rem">Lựa chọn của học sinh theo từng câu</h3>
                  <div class="od-stack" style="--od-gap:8px">
                    ${exam.questionSnapshot.map((q, qi) => {
                      const sel = att.answers[q.id] || [];
                      const ok = isQuestionCorrect(q, sel);
                      const selTexts = sel.map(oid => q.options.find(o => o.id === oid)?.text).filter(Boolean);
                      const corTexts = q.options.filter(o => o.isCorrect).map(o => o.text);
                      return `
                        <div style="padding:10px 12px;border-radius:6px;border:1.5px solid ${ok ? 'var(--status-success-border)' : 'var(--status-danger-border)'};background:${ok ? '#f0fdf4' : '#fef2f2'}">
                          <div class="od-row" style="justify-content:space-between;margin-bottom:4px">
                            <strong>Câu ${qi + 1}: ${escapeHtml(q.text)}</strong>
                            <span class="badge ${ok ? 'badge-success' : 'badge-danger'}">${ok ? 'Đúng' : 'Sai'}</span>
                          </div>
                          <div style="font-size:0.875rem">Đã chọn: <strong>${selTexts.length ? escapeHtml(selTexts.join('; ')) : 'Bỏ trống'}</strong></div>
                          ${!ok ? `<div style="font-size:0.875rem;color:var(--status-success-text)">Đáp án đúng: <strong>${escapeHtml(corTexts.join('; '))}</strong></div>` : ''}
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>

                <div style="grid-column:span 5">
                  <h3 style="margin:0 0 10px;font-size:0.9375rem">Nhật ký vi phạm & Đẩy máy (FR-065)</h3>
                  ${logs.length === 0 ? `
                    <div class="alert alert-neutral">Không ghi nhận vi phạm rời tab, thoát toàn màn hình hay đẩy máy trong lần làm này.</div>
                  ` : `
                    <div class="od-stack" style="--od-gap:8px">
                      ${logs.map(lg => `
                        <div style="padding:10px 12px;border:1px solid var(--border-subtle);border-radius:6px;background:var(--bg-canvas)">
                          <div class="od-row" style="justify-content:space-between;margin-bottom:4px">
                            <span class="badge ${lg.badge}">${escapeHtml(lg.kind)}</span>
                            <span class="mono" style="font-size:0.8125rem;color:var(--text-muted)">${formatTimeClock(lg.time)}</span>
                          </div>
                          <div style="font-weight:700;font-size:0.875rem">${escapeHtml(lg.title)}</div>
                          <div style="font-size:0.8125rem;color:var(--text-secondary)">${escapeHtml(lg.detail)}</div>
                        </div>
                      `).join('')}
                    </div>
                  `}
                </div>
              </div>
            </section>
          `;
        }).join('')}
      </div>
    `;
  }

    const user = uiState.currentUser;
    const years = db.academicYears.filter(y => y.schoolId === user.schoolId);
    const yearId = years.some(y => y.id === uiState.tcStuYearFilter)
      ? uiState.tcStuYearFilter
      : (getCurrentYear(user.schoolId)?.id || years[0]?.id || '');

    const selectedYearObj = years.find(y => y.id === yearId);
    const isCurrentYear = Boolean(selectedYearObj && selectedYearObj.isCurrent);

    const assignedClasses = getTeacherAssignedClasses(user.id, yearId);
    const classId = assignedClasses.some(c => c.id === uiState.tcStuClassFilter)
      ? uiState.tcStuClassFilter
      : (assignedClasses[0]?.id || '');

            <select id="sel-tc-stu-year" class="select">
              ${years.map(y => `<option value="${y.id}" ${y.id === yearId ? 'selected' : ''}>${escapeHtml(y.name)}${y.isCurrent ? ' (Hiện tại)' : ' (Năm cũ)'}</option>`).join('')}
            </select>

            </select>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Mã HS</th>
                ${isCurrentYear ? `
                  <th>Họ tên</th>
                  <th>Lớp</th>
                  <th>Người giám hộ</th>
                  <th>SĐT người giám hộ</th>

  function renderStudentExam() {
    const sess = uiState.studentSession;
    const exam = db.exams.find(e => e.id === sess.examId);
    const student = db.students.find(s => s.id === sess.studentId);
    const att = db.attempts.find(a => a.id === sess.activeAttemptId);
    const clsState = exam.classStates[sess.classId];
    if (!exam || !att || !student) return renderPortal();

    const maxWarnings = clsState.maxWarningsSnap || 2;
    const maxAttempts = clsState.maxAttemptsSnap || 3;
    const qIds = att.shuffledQuestionIds;
    const curIdx = Math.max(0, Math.min(sess.currentQIndex, qIds.length - 1));
    sess.currentQIndex = curIdx;
    const curQId = qIds[curIdx];
    const question = exam.questionSnapshot.find(q => q.id === curQId);

    const optOrder = att.optionOrders[curQId] || question.options.map(o => o.id);
    const orderedOptions = optOrder.map(oid => question.options.find(o => o.id === oid)).filter(Boolean);
    const selectedIds = att.answers[curQId] || [];
    const hasSelection = selectedIds.length > 0;
    const answeredCount = qIds.filter(id => (att.answers[id] || []).length > 0).length;
    const remSec = getRemainingSeconds(att);
    const isFlagged = sess.flaggedQIds.includes(curQId);

    return `
      <div class="exam-fullscreen-shell">
        <header class="exam-topbar">
          <div>
            <div style="font-family:var(--font-display);font-weight:800;font-size:1.0625rem">${escapeHtml(exam.title)}</div>
            <div style="font-size:0.8125rem;color:#e4d8ff">
              Thí sinh: <strong style="color:#ffffff">${escapeHtml(student.fullName)}</strong> (<span class="mono">${escapeHtml(student.code)}</span>) · Lần làm ${att.attemptNumber}/${maxAttempts}
            </div>
          </div>

          <div class="od-cluster">
            <span class="badge ${att.warningCount > 0 ? 'badge-danger' : 'badge-neutral'}">
              ${icon('alert', 14)} Cảnh báo: <strong class="mono">${att.warningCount}/${maxWarnings}</strong>
            </span>
            <div id="live-exam-timer" class="exam-timer ${remSec <= 120 ? 'urgent' : ''}" aria-label="Thời gian còn lại">
              ${formatDurationMMSS(remSec)}
            </div>
            <button type="button" class="btn btn-success" id="btn-st-submit-exam">Nộp bài (${answeredCount}/${qIds.length})</button>
          </div>
        </header>

        <main class="exam-body">
          <div class="od-stack" style="--od-gap:18px">
            <section class="exam-question-stage">
              <div class="od-row" style="justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border-subtle)">
                <div class="od-cluster">
                  <span class="badge badge-brand mono">Câu ${curIdx + 1} / ${qIds.length}</span>
                  <span class="badge badge-neutral">${question.multiSelect ? 'Chọn nhiều đáp án đúng' : 'Chọn 1 đáp án đúng'}</span>
                </div>
                <button type="button" class="btn btn-sm ${isFlagged ? 'btn-danger-outline' : 'btn-subtle'}" id="btn-st-flag-q">
                  ${icon('flag', 14)} ${isFlagged ? 'Bỏ đánh dấu' : 'Đánh dấu xem lại'}
                </button>
              </div>

              <div style="font-family:var(--font-display);font-size:1.25rem;font-weight:800;line-height:1.5;margin-bottom:10px;color:var(--text-primary)">
                ${escapeHtml(question.text)}
              </div>

              ${question.image ? `
                <div class="question-media-frame">
                  <img class="od-media" src="${escapeHtml(question.image.uri)}" width="${question.image.width}" height="${question.image.height}" alt="${escapeHtml(question.image.alt || 'Hình minh họa câu hỏi')}" style="--od-ratio:${question.image.width}/${question.image.height}" />
                </div>
              ` : ''}

              <div class="kahoot-answers-grid" style="margin-top:20px">
                ${orderedOptions.map((opt, oi) => {
                  const isSel = selectedIds.includes(opt.id);
                  const letter = String.fromCharCode(65 + oi);
                  const colorIdx = kahootColorIdx(oi);
                  return `
                    <label class="kahoot-opt k-color-${colorIdx} ${isSel ? 'selected' : hasSelection ? 'dimmed' : ''}" data-st-opt="${opt.id}">
                      <input class="sr-only" type="${question.multiSelect ? 'checkbox' : 'radio'}" name="exam_q_${question.id}" value="${opt.id}" ${isSel ? 'checked' : ''} />
                      <span class="k-shape-badge">
                        ${kahootShape(oi, 22)}
                      </span>
                      <span class="od-fill">
                        <span class="k-opt-letter">Đáp án ${letter}</span>
                        <span class="k-opt-text">${escapeHtml(opt.text)}</span>
                      </span>
                      <span class="k-opt-check" aria-hidden="true">
                        ${isSel ? icon('check', 16) : ''}
                      </span>
                    </label>
                  `;
                }).join('')}
              </div>

              <div class="od-row" style="justify-content:space-between;margin-top:22px;padding-top:16px;border-top:1px solid var(--border-subtle)">
                <button type="button" class="btn btn-secondary" id="btn-st-prev-q" ${curIdx === 0 ? 'disabled' : ''}>
                  ${icon('arrowLeft', 16)} Câu trước
                </button>
                <button type="button" class="btn btn-primary" id="btn-st-next-q" ${curIdx === qIds.length - 1 ? 'disabled' : ''}>
                  Câu tiếp ${icon('arrowRight', 16)}
                </button>
              </div>
            </section>
          </div>

          <aside class="od-stack" style="--od-gap:16px">

              <h2 class="card-title" style="margin-bottom:12px">Danh sách câu hỏi</h2>
              <div class="q-nav-grid">
                ${qIds.map((qid, i) => {
                  const ans = (att.answers[qid] || []).length > 0;
                  const flg = sess.flaggedQIds.includes(qid);
                  const cls = i === curIdx ? 'current' : ans ? 'answered' : '';
                  return `<button type="button" class="q-nav-btn ${cls} ${flg ? 'flagged' : ''}" data-st-jump-q="${i}">${i + 1}</button>`;
                }).join('')}
              </div>
              <div class="od-stack" style="--od-gap:6px;margin-top:16px;font-size:0.8125rem;color:var(--text-secondary)">
                <div>Đã trả lời: <strong>${answeredCount}/${qIds.length}</strong> câu</div>
                <div>Thứ tự câu hỏi và đáp án A, B, C, D đã được xáo trộn riêng cho bạn.</div>
              </div>
            </div>

            <div class="card card-pad" style="background:#f8f8f8">
              <div style="font-weight:800;font-size:0.875rem;margin-bottom:6px">Xử lý sự cố & Kiểm thử giám sát</div>
              <p class="field-hint" style="margin-bottom:10px">Kiểm chứng quy tắc chống gian lận (FR-044) và gián đoạn kết nối (FR-045):</p>
              <div class="od-stack" style="--od-gap:8px">
                <button type="button" class="btn btn-sm btn-danger-outline" id="btn-sim-tab-leave">${icon('alert', 14)} Rời tab / Thoát toàn màn hình</button>
                <button type="button" class="btn btn-sm btn-secondary" id="btn-sim-disconnect">${icon('monitorOff', 14)} Gián đoạn kết nối (&gt;60 giây)</button>
              </div>
            </div>
          </aside>
        </main>
      </div>
    `;
  }

  function openCreateSchoolDialog() {
    openDialog({
      title: 'Tạo trường học mới',
      bodyHtml: `
        <div class="field-group">
          <label class="field-label" for="dlg-sch-name">Tên trường <span class="req">*</span></label>
          <input id="dlg-sch-name" class="input" type="text" placeholder="Ví dụ: Trường THPT Lê Quý Đôn" />
        </div>
        <div class="field-group">
          <label class="field-label" for="dlg-sch-code">Mã trường (viết tắt) <span class="req">*</span></label>
          <input id="dlg-sch-code" class="input mono" type="text" placeholder="Ví dụ: LQD" />
        </div>
        <p class="field-hint">Trường mới tự động áp dụng quy chế mặc định: tối đa 3 lần làm bài và 2 lần cảnh báo gian lận (FR-014).</p>
      `,
      footerHtml: `
        <button type="button" class="btn btn-secondary" id="dlg-cancel">Hủy</button>
        <button type="button" class="btn btn-primary" id="dlg-save">Tạo trường</button>
      `,
      onMount: (dlg) => {
        dlg.querySelector('#dlg-cancel').addEventListener('click', closeDialog);
        dlg.querySelector('#dlg-save').addEventListener('click', () => {
          const name = dlg.querySelector('#dlg-sch-name').value.trim();
          const code = dlg.querySelector('#dlg-sch-code').value.trim().toUpperCase();
          if (!name || !code) { showToast('Vui lòng nhập tên và mã trường.', 'error'); return; }
          if (db.schools.some(s => s.code === code)) { showToast('Mã trường này đã tồn tại.', 'error'); return; }
          const schId = uid('sch');
          db.schools.push({
            id: schId, name, code, locked: false,
            maxAttempts: 3, maxWarnings: 2, disconnectTimeoutSec: 60,
            createdAt: new Date().toISOString().slice(0, 10)
          });
          db.academicYears.push({ id: uid('ay'), schoolId: schId, name: '2026–2027', isCurrent: true });
          closeDialog();
          showToast(`Đã tạo ${name}.`);
          render();
        });
      }
    });
  }

    const sid = uiState.currentUser.schoolId;

    const oldYears = years.filter(y => !y.isCurrent);
    const srcYear = oldYears[0] || years[0];
    const dstYear = getCurrentYear(sid) || years[years.length - 1];
    const srcClasses = db.classes.filter(c => c.schoolId === sid && c.academicYearId === srcYear?.id);
    const dstClasses = db.classes.filter(c => c.schoolId === sid && c.academicYearId === dstYear?.id);

    openDialog({

      bodyHtml: `
        <p class="field-hint" style="margin:0">Hệ thống vẫn giữ nguyên lịch sử "năm học nào, học sinh học lớp nào" của khóa trước (FR-012).</p>

          <div class="field-group">
            <label class="field-label" for="dlg-pro-src-cls">Lớp nguồn (${escapeHtml(srcYear?.name || '')})</label>
            <select id="dlg-pro-src-cls" class="select">
              ${srcClasses.map(c => `<option value="${c.id}">${escapeHtml(c.name)} (${getStudentsInClass(c.id, srcYear.id).length} HS)</option>`).join('')}
            </select>
          </div>
          <div class="field-group">
            <label class="field-label" for="dlg-pro-dst-cls">Lớp đích (${escapeHtml(dstYear?.name || '')})</label>
            <select id="dlg-pro-dst-cls" class="select">

            </select>
          </div>
        </div>
      `,
      footerHtml: `
        <button type="button" class="btn btn-secondary" id="dlg-cancel">Hủy</button>
        <button type="button" class="btn btn-primary" id="dlg-save">Thực hiện lên lớp</button>
      `,
      onMount: (dlg) => {

        dlg.querySelector('#dlg-save').addEventListener('click', () => {
          const srcClsId = dlg.querySelector('#dlg-pro-src-cls').value;

        });
      }

  function openImportStudentsDialog() {
    const sid = uiState.currentUser.schoolId;
    const yearId = uiState.scStudentYearFilter || getCurrentYear(sid)?.id;
    const sampleCsv = [
      'CVA26009,Nguyễn Bảo Lâm,10A1,2011-04-12,Hà Nội,0912000111,Số 8 Lý Nam Đế,Nguyễn Văn Sơn',
      'CVA26010,Trần Minh Anh,10A1,2011-08-25,Hải Dương,0912000222,Số 15 Hàng Bông,Trần Thị Hoa'
    ].join('\n');

    openDialog({
      title: 'Nhập danh sách học sinh từ file CSV',
      wide: true,
      bodyHtml: `
        <p class="field-hint" style="margin:0">Định dạng 8 cột theo FR-011: <span class="mono">Mã HS, Họ tên, Tên lớp, Ngày sinh, Quê quán, SĐT giám hộ, Địa chỉ, Tên giám hộ</span>. Hệ thống kiểm tra trùng mã trong phạm vi trường.</p>
        <div class="field-group">
          <label class="field-label" for="dlg-imp-file">Chọn file .csv / .txt từ máy (tùy chọn)</label>
          <input id="dlg-imp-file" class="input" type="file" accept=".csv,.txt" />
        </div>
        <div class="field-group">
          <label class="field-label" for="dlg-imp-text">Nội dung danh sách (có thể sửa trực tiếp trước khi nhập)</label>
          <textarea id="dlg-imp-text" class="textarea mono" style="min-height:130px;font-size:0.8125rem">${escapeHtml(sampleCsv)}</textarea>
        </div>
      `,
      footerHtml: `
        <button type="button" class="btn btn-secondary" id="dlg-cancel">Hủy</button>
        <button type="button" class="btn btn-primary" id="dlg-save">Kiểm tra & Nhập danh sách</button>
      `,
      onMount: (dlg) => {
        dlg.querySelector('#dlg-imp-file').addEventListener('change', (ev) => {
          const f = ev.target.files?.[0];
          if (!f) return;
          const reader = new FileReader();
          reader.onload = () => { dlg.querySelector('#dlg-imp-text').value = String(reader.result || ''); };
          reader.readAsText(f, 'UTF-8');
        });
        dlg.querySelector('#dlg-cancel').addEventListener('click', closeDialog);
        dlg.querySelector('#dlg-save').addEventListener('click', () => {
          const lines = dlg.querySelector('#dlg-imp-text').value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
          const errors = [];
          const pending = [];
          for (let i = 0; i < lines.length; i++) {
            const parts = lines[i].split(',').map(p => p.trim());
            if (parts.length < 8) { errors.push(`Dòng ${i + 1}: thiếu đủ 8 cột`); continue; }
            const [codeRaw, fullName, className, dob, hometown, gPhone, address, gName] = parts;
            const code = codeRaw.toUpperCase();
            if (db.students.some(s => s.schoolId === sid && !s.anonymized && s.code.toUpperCase() === code) || pending.some(p => p.code === code)) {
              errors.push(`Dòng ${i + 1}: trùng mã học sinh "${code}" trong trường`);
              continue;
            }
            let cls = db.classes.find(c => c.schoolId === sid && c.academicYearId === yearId && c.name.toLowerCase() === className.toLowerCase());
            if (!cls) {
              cls = { id: uid('cls'), schoolId: sid, academicYearId: yearId, name: className };
              db.classes.push(cls);
            }
            pending.push({
              id: uid('stu'), schoolId: sid, code, fullName, dob, hometown, address,
              guardianName: gName, guardianPhone: gPhone, anonymized: false,
              enrollments: [{ academicYearId: yearId, classId: cls.id }]
            });
          }
          if (errors.length > 0) {
            showToast(errors.join(' | '), 'error');
            return;
          }
          db.students.push(...pending);
          closeDialog();
          showToast(`Đã nhập thành công ${pending.length} học sinh.`);
          render();
        });
      }
    });
  }

          <div style="grid-column:span 5">

              <div style="font-size:0.75rem;font-weight:800;color:var(--k-purple);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px">Xem trước hiển thị Kahoot!</div>
              <div class="od-cluster" style="margin-bottom:8px">
                ${getDifficultyBadge(draft.difficulty)}
                <span class="badge badge-neutral">${draft.multiSelect ? 'Chọn nhiều đáp án' : 'Chọn 1 đáp án'}</span>
              </div>
              <div id="qe-preview-text" style="font-weight:700;margin-bottom:10px">${escapeHtml(draft.text || 'Nội dung câu hỏi sẽ hiển thị tại đây...')}</div>
              ${draft.image ? `
                <div class="question-media-frame" style="margin:8px 0">
                  <img class="od-media" src="${escapeHtml(draft.image.uri)}" width="${draft.image.width}" height="${draft.image.height}" alt="Xem trước ảnh câu hỏi" style="--od-ratio:${draft.image.width}/${draft.image.height}" />
                </div>
              ` : ''}
              <div class="k-mini-grid" style="margin-top:10px">
                ${draft.options.map((o, idx) => `
                  <div class="k-mini-opt ${o.isCorrect ? 'is-correct' : ''}">
                    <span class="k-mini-shape k-color-${kahootColorIdx(idx)}">${kahootShape(idx, 13)}</span>
                    <span class="od-fill">${escapeHtml(o.text || '...')}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;

      box.querySelector('#qe-diff').addEventListener('change', (e) => { draft.difficulty = e.target.value; renderEditorBody(dlg); });
      box.querySelector('#qe-mode').addEventListener('change', (e) => {
        draft.multiSelect = e.target.value === 'multi';
        if (!draft.multiSelect) {
          let seen = false;
          draft.options.forEach(o => { if (o.isCorrect && !seen) seen = true; else o.isCorrect = false; });
          if (!seen && draft.options[0]) draft.options[0].isCorrect = true;
        }
        renderEditorBody(dlg);
      });
      box.querySelector('#qe-text').addEventListener('input', (e) => {
        draft.text = e.target.value;
        box.querySelector('#qe-preview-text').textContent = draft.text || 'Nội dung câu hỏi sẽ hiển thị tại đây...';
      });
      box.querySelector('#qe-img-file').addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const dataUri = String(reader.result);
          const probe = new Image();
          probe.onload = () => {
            draft.image = { uri: dataUri, width: probe.naturalWidth || 520, height: probe.naturalHeight || 300, alt: file.name };
            renderEditorBody(dlg);
          };
          probe.src = dataUri;
        };
        reader.readAsDataURL(file);
      });
      const rmBtn = box.querySelector('#qe-rm-img');
      if (rmBtn) rmBtn.addEventListener('click', () => { draft.image = null; renderEditorBody(dlg); });

      box.querySelector('#qe-add-opt').addEventListener('click', () => {
        draft.options.push({ id: `o${draft.options.length + 1}_${Date.now()}`, text: '', isCorrect: false });
        renderEditorBody(dlg);
      });

      box.querySelectorAll('[data-opt-correct-btn]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.getAttribute('data-opt-correct-btn'));
          if (draft.multiSelect) {
            draft.options[idx].isCorrect = !draft.options[idx].isCorrect;
          } else {
            draft.options.forEach((o, i) => { o.isCorrect = (i === idx); });
          }
          renderEditorBody(dlg);
        });
      });

      box.querySelectorAll('[data-opt-text]').forEach(inp => {
        inp.addEventListener('input', () => {
          const idx = Number(inp.getAttribute('data-opt-text'));
          draft.options[idx].text = inp.value;
        });
      });

      box.querySelectorAll('[data-opt-del]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.getAttribute('data-opt-del'));
          draft.options.splice(idx, 1);
          renderEditorBody(dlg);
        });
      });
    }

    openDialog({
      title: existing ? 'Chỉnh sửa câu hỏi (Kahoot! Studio)' : `Tạo câu hỏi mới (${getSubjectName(user.subjectId)})`,
      wide: true,
      bodyHtml: '',
      footerHtml: `
        <button type="button" class="btn btn-secondary" id="dlg-cancel">Hủy</button>
        <button type="button" class="btn btn-success" id="dlg-save">${existing ? 'Lưu câu hỏi' : 'Thêm vào ngân hàng'}</button>
      `,
      onMount: (dlg) => {
        renderEditorBody(dlg);
        dlg.querySelector('#dlg-cancel').addEventListener('click', closeDialog);
        dlg.querySelector('#dlg-save').addEventListener('click', () => {
          if (!draft.text.trim()) { showToast('Vui lòng nhập nội dung câu hỏi.', 'error'); return; }
          if (draft.options.some(o => !o.text.trim())) { showToast('Vui lòng điền đủ nội dung cho tất cả đáp án.', 'error'); return; }
          if (!draft.options.some(o => o.isCorrect)) { showToast('Phải chọn ít nhất 1 đáp án đúng.', 'error'); return; }
          if (existing) {
            existing.difficulty = draft.difficulty;
            existing.multiSelect = draft.multiSelect;
            existing.text = draft.text.trim();
            existing.image = draft.image;
            existing.options = draft.options;
          } else {
            db.questions.push({
              id: uid('q'),
              schoolId: user.schoolId,
              teacherId: user.id,
              subjectId: user.subjectId,
              difficulty: draft.difficulty,
              multiSelect: draft.multiSelect,
              text: draft.text.trim(),
              image: draft.image,
              options: draft.options
            });
          }
          closeDialog();
          showToast(existing ? 'Đã cập nhật câu hỏi (không ảnh hưởng đề đã rút).' : 'Đã thêm câu hỏi mới vào ngân hàng.');
          render();
        });
      }
    });
  }

  function openCreateExamDialog() {
    const user = uiState.currentUser;
    const years = db.academicYears.filter(y => y.schoolId === user.schoolId);
    const curY = getCurrentYear(user.schoolId) || years[0];
    const bank = db.questions.filter(q => q.teacherId === user.id);
    const availEasy = bank.filter(q => q.difficulty === 'easy').length;
    const availMed = bank.filter(q => q.difficulty === 'medium').length;
    const availHard = bank.filter(q => q.difficulty === 'hard').length;

    let selectedYearId = curY ? curY.id : '';

    function renderClassCheckboxes(dlg) {
      const list = getTeacherAssignedClasses(user.id, selectedYearId);
      const wrap = dlg.querySelector('#ce-class-list');
      wrap.innerHTML = list.length === 0
        ? '<span style="color:var(--status-danger-text)">Bạn chưa được phân công lớp nào trong năm học này.</span>'
        : list.map(c => `
          <label class="od-row" style="padding:6px 12px;border:1.5px solid var(--border-subtle);border-radius:6px;background:var(--bg-canvas);cursor:pointer">
            <input type="checkbox" name="ce-cls" value="${c.id}" checked />
            <strong>Lớp ${escapeHtml(c.name)}</strong>
          </label>
        `).join('');
    }

    openDialog({
      title: `Tạo bài thi & Rút đề ngẫu nhiên (${getSubjectName(user.subjectId)})`,
      wide: true,
      bodyHtml: `
        <div class="od-grid" style="--od-cols:2;--od-gap:12px">
          <div class="field-group">
            <label class="field-label" for="ce-title">Tên bài thi <span class="req">*</span></label>
            <input id="ce-title" class="input" type="text" placeholder="Ví dụ: Kiểm tra 45 phút Chương 2" />
          </div>
          <div class="field-group">
            <label class="field-label" for="ce-code">Mã bài thi (duy nhất toàn hệ thống) <span class="req">*</span></label>
            <input id="ce-code" class="input mono" type="text" value="QUIQ-${Math.random().toString(36).slice(2, 6).toUpperCase()}" />
          </div>
        </div>

        <div class="od-grid" style="--od-cols:2;--od-gap:12px">
          <div class="field-group">
            <label class="field-label" for="ce-year">Năm học</label>
            <select id="ce-year" class="select">
              ${years.map(y => `<option value="${y.id}" ${y.id === selectedYearId ? 'selected' : ''}>${escapeHtml(y.name)}${y.isCurrent ? ' (Hiện tại)' : ''}</option>`).join('')}
            </select>
          </div>
          <div class="field-group">
            <label class="field-label" for="ce-dur">Thời gian làm bài (phút) <span class="req">*</span></label>
            <input id="ce-dur" class="input num" type="number" min="5" max="180" value="30" />
          </div>
        </div>

        <div class="field-group">
          <label class="field-label">Cấu hình rút câu ngẫu nhiên theo mức độ khó (FR-030)</label>
          <div class="od-grid" style="--od-cols:3;--od-gap:12px">
            <div class="field-group">
              <label class="field-hint" for="ce-easy">Số câu Dễ (Khả dụng: <strong>${availEasy}</strong>)</label>
              <input id="ce-easy" class="input num" type="number" min="0" value="${Math.min(2, availEasy)}" />
            </div>
            <div class="field-group">
              <label class="field-hint" for="ce-med">Số câu Trung bình (Khả dụng: <strong>${availMed}</strong>)</label>
              <input id="ce-med" class="input num" type="number" min="0" value="${Math.min(2, availMed)}" />
            </div>
            <div class="field-group">
              <label class="field-hint" for="ce-hard">Số câu Khó (Khả dụng: <strong>${availHard}</strong>)</label>
              <input id="ce-hard" class="input num" type="number" min="0" value="${Math.min(1, availHard)}" />
            </div>
          </div>
          <p class="field-hint">Hệ thống rút 1 bộ câu cố định và sao chép nội dung vào đề; mọi lớp được gán thi cùng bộ câu này.</p>
        </div>

        <div class="field-group">
          <label class="field-label">Gán bài thi cho lớp phụ trách <span class="req">*</span></label>
          <div id="ce-class-list" class="od-cluster"></div>
        </div>
      `,
      footerHtml: `
        <button type="button" class="btn btn-secondary" id="dlg-cancel">Hủy</button>
        <button type="button" class="btn btn-primary" id="dlg-save">Rút đề & Tạo bài thi</button>
      `,
      onMount: (dlg) => {
        renderClassCheckboxes(dlg);
        dlg.querySelector('#ce-year').addEventListener('change', (e) => {
          selectedYearId = e.target.value;
          renderClassCheckboxes(dlg);
        });
        dlg.querySelector('#dlg-cancel').addEventListener('click', closeDialog);
        dlg.querySelector('#dlg-save').addEventListener('click', () => {
          const title = dlg.querySelector('#ce-title').value.trim();
          const code = dlg.querySelector('#ce-code').value.trim().toUpperCase();
          const duration = parseInt(dlg.querySelector('#ce-dur').value, 10);
          const nEasy = parseInt(dlg.querySelector('#ce-easy').value, 10) || 0;
          const nMed = parseInt(dlg.querySelector('#ce-med').value, 10) || 0;
          const nHard = parseInt(dlg.querySelector('#ce-hard').value, 10) || 0;
          const classIds = Array.from(dlg.querySelectorAll('input[name="ce-cls"]:checked')).map(c => c.value);

          if (!title || !code || !(duration >= 1)) { showToast('Vui lòng nhập Tên bài thi, Mã và Thời gian hợp lệ.', 'error'); return; }
          if (db.exams.some(e => e.code.toUpperCase() === code)) { showToast(`Mã bài thi "${code}" đã tồn tại trên hệ thống.`, 'error'); return; }
          if (classIds.length === 0) { showToast('Hãy chọn ít nhất 1 lớp được gán bài thi.', 'error'); return; }
          if (nEasy + nMed + nHard <= 0) { showToast('Tổng số câu rút phải lớn hơn 0.', 'error'); return; }
          if (nEasy > availEasy || nMed > availMed || nHard > availHard) {
            showToast(`Ngân hàng câu hỏi không đủ số câu theo cấu hình (Dễ: ${availEasy}, TB: ${availMed}, Khó: ${availHard}).`, 'error');
            return;
          }

          const picked = [
            ...shuffleArray(bank.filter(q => q.difficulty === 'easy')).slice(0, nEasy),
            ...shuffleArray(bank.filter(q => q.difficulty === 'medium')).slice(0, nMed),
            ...shuffleArray(bank.filter(q => q.difficulty === 'hard')).slice(0, nHard)
          ].map(q => JSON.parse(JSON.stringify(q)));

          const school = getSchool(user.schoolId);
          const classStates = {};
          for (const cid of classIds) {
            classStates[cid] = {
              releaseStatus: 'draft',
              answersPublished: false,
              scoresPublished: false,
              maxAttemptsSnap: school.maxAttempts,
              maxWarningsSnap: school.maxWarnings,
              releasedAt: null
            };
          }

          const examId = uid('ex');
          db.exams.unshift({
            id: examId,
            code,
            title,
            schoolId: user.schoolId,
            teacherId: user.id,
            subjectId: user.subjectId,
            academicYearId: selectedYearId,
            durationMinutes: duration,
            drawConfig: { easy: nEasy, medium: nMed, hard: nHard },
            assignedClassIds: classIds,
            createdAt: Date.now(),
            questionSnapshot: picked,
            classStates
          });
          uiState.tcLiveExamId = examId;
          uiState.tcLiveClassId = classIds[0];
          closeDialog();
          showToast(`Đã rút ${picked.length} câu hỏi vào bản sao cố định và tạo bài thi ${code}.`);
          render();
        });
      }
    });
  }

  /* =========================================================================
     ROOT RENDER & EVENT DELEGATION
     ========================================================================= */
  function render() {
    const root = document.getElementById('app-root');
    if (!root) return;

    if (uiState.activeView === 'portal' || (!uiState.currentUser && !uiState.activeView.startsWith('st_'))) {
      root.innerHTML = renderPortal();
    } else if (uiState.activeView === 'st_waiting') {
      root.innerHTML = renderStudentWaiting();
    } else if (uiState.activeView === 'st_exam') {
      root.innerHTML = renderStudentExam();
    } else if (uiState.activeView === 'st_result') {
      root.innerHTML = renderStudentResult();
    } else if (uiState.currentUser) {
      let inner = '';
      if (uiState.currentUser.role === 'super_admin') inner = renderSuperAdminView();
      else if (uiState.currentUser.role === 'school_admin') inner = renderSchoolAdminView();
      else inner = renderTeacherView();
      root.innerHTML = renderAppShell(inner);
    }

    bindCurrentViewInputs();
  }

  function bindCurrentViewInputs() {
    const loginUser = document.getElementById('inp-login-user');
    const loginPass = document.getElementById('inp-login-pass');
    if (loginUser) loginUser.addEventListener('input', (e) => { uiState.loginUsername = e.target.value; });
    if (loginPass) {
      loginPass.addEventListener('input', (e) => { uiState.loginPassword = e.target.value; });
      loginPass.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') doStaffLogin(uiState.loginUsername, uiState.loginPassword);
      });
    }

    const joinExam = document.getElementById('inp-join-exam');
    const joinStu = document.getElementById('inp-join-student');
    if (joinExam) joinExam.addEventListener('input', (e) => { uiState.joinExamCode = e.target.value; });
    if (joinStu) {
      joinStu.addEventListener('input', (e) => { uiState.joinStudentCode = e.target.value; });
      joinStu.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') enterStudentExamFlow(uiState.joinExamCode, uiState.joinStudentCode);
      });
    }

    const lookupSch = document.getElementById('sel-lookup-school');
    const lookupCode = document.getElementById('inp-lookup-code');
    const lookupYear = document.getElementById('sel-lookup-year');
    if (lookupSch) lookupSch.addEventListener('change', (e) => {
      uiState.lookupSchoolId = e.target.value;
      render();
    });
    if (lookupCode) {
      lookupCode.addEventListener('input', (e) => { uiState.lookupStudentCode = e.target.value; });
      lookupCode.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { uiState.lookupSubmitted = true; render(); }
      });
    }
    if (lookupYear) lookupYear.addEventListener('change', (e) => {
      uiState.lookupYearId = e.target.value;
      if (uiState.lookupSubmitted) render();
    });

    const selSaAdm = document.getElementById('sel-sa-admin-filter');
    if (selSaAdm) selSaAdm.addEventListener('change', (e) => { uiState.saAdminSchoolFilter = e.target.value; render(); });

    const selScStuY = document.getElementById('sel-sc-stu-year');
    if (selScStuY) selScStuY.addEventListener('change', (e) => { uiState.scStudentYearFilter = e.target.value; uiState.scStudentClassFilter = ''; render(); });

    const selScStuC = document.getElementById('sel-sc-stu-class');
    if (selScStuC) selScStuC.addEventListener('change', (e) => { uiState.scStudentClassFilter = e.target.value; render(); });

    const inpScSearch = document.getElementById('inp-sc-stu-search');
    if (inpScSearch) inpScSearch.addEventListener('input', (e) => {
      uiState.scStudentSearch = e.target.value;
      render();
      const el = document.getElementById('inp-sc-stu-search');
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });

    const chkShowAnon = document.getElementById('chk-sc-show-anon');
    if (chkShowAnon) chkShowAnon.addEventListener('change', (e) => { uiState.scShowAnonymized = e.target.checked; render(); });

    const selScAsgY = document.getElementById('sel-sc-assign-year');
    if (selScAsgY) selScAsgY.addEventListener('change', (e) => { uiState.scAssignYearFilter = e.target.value; render(); });

    const selScVaultGv = document.getElementById('sel-sc-vault-gv');
    if (selScVaultGv) selScVaultGv.addEventListener('change', (e) => { uiState.scVaultTeacherFilter = e.target.value; render(); });

    const inpTcBankSearch = document.getElementById('inp-tc-bank-search');
    if (inpTcBankSearch) inpTcBankSearch.addEventListener('input', (e) => {
      uiState.tcBankSearch = e.target.value;
      render();
      const el = document.getElementById('inp-tc-bank-search');
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });

    const selTcExamYear = document.getElementById('sel-tc-exam-year');
    if (selTcExamYear) selTcExamYear.addEventListener('change', (e) => { uiState.tcExamYearFilter = e.target.value; render(); });

    const selLiveExam = document.getElementById('sel-live-exam');
    if (selLiveExam) selLiveExam.addEventListener('change', (e) => {
      uiState.tcLiveExamId = e.target.value;
      const ex = db.exams.find(x => x.id === uiState.tcLiveExamId);
      uiState.tcLiveClassId = ex ? (ex.assignedClassIds[0] || '') : '';
      render();
    });

    const selLiveCls = document.getElementById('sel-live-class');
    if (selLiveCls) selLiveCls.addEventListener('change', (e) => { uiState.tcLiveClassId = e.target.value; render(); });

    const selResYear = document.getElementById('sel-res-year');
    if (selResYear) selResYear.addEventListener('change', (e) => {
      uiState.tcResultYearFilter = e.target.value;
      uiState.tcResultClassId = '';
      uiState.tcResultExamId = '';
      render();
    });

    const selResClass = document.getElementById('sel-res-class');
    if (selResClass) selResClass.addEventListener('change', (e) => {
      uiState.tcResultClassId = e.target.value;
      uiState.tcResultExamId = '';
      render();
    });

    const selResExam = document.getElementById('sel-res-exam');
    if (selResExam) selResExam.addEventListener('change', (e) => { uiState.tcResultExamId = e.target.value; render(); });

    const selTcStuY = document.getElementById('sel-tc-stu-year');
    if (selTcStuY) selTcStuY.addEventListener('change', (e) => { uiState.tcStuYearFilter = e.target.value; uiState.tcStuClassFilter = ''; render(); });

    const selTcStuC = document.getElementById('sel-tc-stu-class');
    if (selTcStuC) selTcStuC.addEventListener('change', (e) => { uiState.tcStuClassFilter = e.target.value; render(); });
  }

  document.getElementById('app-root').addEventListener('click', (e) => {
    const target = e.target.closest('button, [data-st-opt]');
    if (!target) return;

    const portalTab = target.getAttribute('data-portal-tab');
    if (portalTab) { uiState.portalTab = portalTab; render(); return; }

    if (target.id === 'btn-submit-login') {
      doStaffLogin(uiState.loginUsername, uiState.loginPassword);
      return;
    }

    const quickLogin = target.getAttribute('data-quick-login');
    if (quickLogin) {
      uiState.loginUsername = quickLogin;
      uiState.loginPassword = '123';
      doStaffLogin(quickLogin, '123');
      return;
    }

    if (target.id === 'btn-submit-join') {
      enterStudentExamFlow(uiState.joinExamCode, uiState.joinStudentCode);
      return;
    }

    const quickJoin = target.getAttribute('data-quick-join');
    if (quickJoin) {
      const [exCode, stCode] = quickJoin.split('|');
      uiState.joinExamCode = exCode;
      uiState.joinStudentCode = stCode;
      enterStudentExamFlow(exCode, stCode);
      return;
    }

    if (target.id === 'btn-submit-lookup') {
      uiState.lookupSubmitted = true;
      render();
      return;
    }

    const navId = target.getAttribute('data-nav');
    if (navId) { uiState.activeView = navId; render(); return; }
    if (target.id === 'btn-logout') { logoutStaff(); return; }

    const saSchFilter = target.getAttribute('data-sa-sch-filter');
    if (saSchFilter) { uiState.saSchoolFilter = saSchFilter; render(); return; }
    if (target.id === 'btn-sa-add-school') { openCreateSchoolDialog(); return; }
    if (target.id === 'btn-sa-add-admin') { openCreateSchoolAdminDialog(); return; }

    const toggleLockId = target.getAttribute('data-toggle-school-lock');
    if (toggleLockId) {
      const sch = getSchool(toggleLockId);
      if (!sch) return;
      if (!sch.locked) {
        openDialog({
          title: `Xác nhận khóa trường ${sch.name}`,
          bodyHtml: `<div class="alert alert-danger">${icon('lock', 18)}<div>Khi khóa trường, toàn bộ Admin trường, Giáo viên và Học sinh của trường này sẽ không thể đăng nhập hoặc tổ chức thi.</div></div>`,
          footerHtml: `<button type="button" class="btn btn-secondary" id="dlg-cancel">Hủy</button><button type="button" class="btn btn-danger" id="dlg-confirm">Xác nhận khóa trường</button>`,
          onMount: (dlg) => {
            dlg.querySelector('#dlg-cancel').addEventListener('click', closeDialog);
            dlg.querySelector('#dlg-confirm').addEventListener('click', () => {
              sch.locked = true; closeDialog(); showToast(`Đã khóa ${sch.name}.`, 'warning'); render();
            });
          }
        });
      } else {
        sch.locked = false; showToast(`Đã mở khóa ${sch.name}.`); render();
      }
      return;
    }

    const resetPwId = target.getAttribute('data-reset-pw');
    if (resetPwId) { openResetPasswordDialog(resetPwId); return; }

    if (target.id === 'btn-sc-add-subject') {
      const sid = uiState.currentUser.schoolId;
      openDialog({
        title: 'Thêm môn học mới',

      });

    const editSubId = target.getAttribute('data-sc-edit-sub');

        title: 'Đổi tên môn học',

        footerHtml: `<button type="button" class="btn btn-secondary" id="dlg-cancel">Hủy</button><button type="button" class="btn btn-primary" id="dlg-save">Lưu</button>`,
