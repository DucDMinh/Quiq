          dlg.querySelector('#dlg-cancel').addEventListener('click', closeDialog);
          dlg.querySelector('#dlg-save').addEventListener('click', () => {
            const name = dlg.querySelector('#dlg-sub-edit').value.trim();
            if (!name) return;
            sub.name = name; closeDialog(); showToast('Đã cập nhật tên môn học.'); render();
          });
        }
      });
      return;
    }

    const delSubId = target.getAttribute('data-sc-del-sub');
    if (delSubId) {
      if (db.users.some(u => u.role === 'teacher' && u.subjectId === delSubId)) {
        showToast('Không thể xóa môn đang có giáo viên phụ trách cố định.', 'error');
        return;
      }
      db.subjects = db.subjects.filter(s => s.id !== delSubId);
      showToast('Đã xóa môn học.'); render(); return;
    }

    if (target.id === 'btn-sc-add-teacher') { openCreateTeacherDialog(); return; }

    const yearPick = target.getAttribute('data-sc-year-pick');
    if (yearPick) { uiState.scYearFilter = yearPick; render(); return; }

    if (target.id === 'btn-sc-add-year') {
      const sid = uiState.currentUser.schoolId;
      openDialog({
        title: 'Tạo năm học mới',
        bodyHtml: `
          <div class="field-group"><label class="field-label" for="dlg-ay-name">Tên năm học <span class="req">*</span></label><input id="dlg-ay-name" class="input" type="text" placeholder="Ví dụ: 2027–2028" /></div>
          <label class="od-row" style="cursor:pointer"><input type="checkbox" id="dlg-ay-cur" /> Đặt làm năm học hiện tại</label>
        `,
        footerHtml: `<button type="button" class="btn btn-secondary" id="dlg-cancel">Hủy</button><button type="button" class="btn btn-primary" id="dlg-save">Tạo năm học</button>`,
        onMount: (dlg) => {
          dlg.querySelector('#dlg-cancel').addEventListener('click', closeDialog);
          dlg.querySelector('#dlg-save').addEventListener('click', () => {
            const name = dlg.querySelector('#dlg-ay-name').value.trim();
            const isCurrent = dlg.querySelector('#dlg-ay-cur').checked;
            if (!name) return;
            if (isCurrent) db.academicYears.filter(y => y.schoolId === sid).forEach(y => { y.isCurrent = false; });
            const ayId = uid('ay');
            db.academicYears.push({ id: ayId, schoolId: sid, name, isCurrent });
            uiState.scYearFilter = ayId;
            closeDialog(); showToast(`Đã tạo năm học ${name}.`); render();
          });
        }
      });
      return;
    }

    if (target.id === 'btn-sc-add-class') {
      const sid = uiState.currentUser.schoolId;
      const yearId = uiState.scYearFilter || getCurrentYear(sid)?.id;
      openDialog({
        title: `Tạo lớp học mới (Năm ${getYearName(yearId)})`,
        bodyHtml: `<div class="field-group"><label class="field-label" for="dlg-cls-name">Tên lớp <span class="req">*</span></label><input id="dlg-cls-name" class="input" type="text" placeholder="Ví dụ: 10A3" /></div>`,
        footerHtml: `<button type="button" class="btn btn-secondary" id="dlg-cancel">Hủy</button><button type="button" class="btn btn-primary" id="dlg-save">Tạo lớp</button>`,
        onMount: (dlg) => {
          dlg.querySelector('#dlg-cancel').addEventListener('click', closeDialog);
          dlg.querySelector('#dlg-save').addEventListener('click', () => {
            const name = dlg.querySelector('#dlg-cls-name').value.trim();
            if (!name) return;
            db.classes.push({ id: uid('cls'), schoolId: sid, academicYearId: yearId, name });
            closeDialog(); showToast(`Đã tạo lớp ${name}.`); render();
          });
        }
      });
      return;
    }

    if (target.id === 'btn-sc-promote') { openPromoteStudentsDialog(); return; }
    if (target.id === 'btn-sc-add-student') { openStudentFormDialog(null); return; }
    if (target.id === 'btn-sc-import-students') { openImportStudentsDialog(); return; }

    const editStuId = target.getAttribute('data-sc-edit-stu');
    if (editStuId) { openStudentFormDialog(editStuId); return; }

    const stuHistId = target.getAttribute('data-sc-stu-history');
    if (stuHistId) {
      const st = db.students.find(x => x.id === stuHistId);
      if (!st) return;
      openDialog({
        title: `Lịch sử lớp học — ${st.anonymized ? st.anonCode : st.fullName}`,
        bodyHtml: `
          <div class="od-stack" style="--od-gap:8px">
            ${st.enrollments.map(enr => `
              <div class="od-row" style="justify-content:space-between;padding:10px 12px;background:var(--bg-canvas);border-radius:6px;border:1px solid var(--border-subtle)">
                <span>Năm học <strong>${escapeHtml(getYearName(enr.academicYearId))}</strong></span>
                <span class="badge badge-brand">Lớp ${escapeHtml(getClass(enr.classId)?.name || '—')}</span>
              </div>
            `).join('')}
          </div>
        `,
        footerHtml: `<button type="button" class="btn btn-primary" id="dlg-ok">Đóng</button>`,
        onMount: (dlg) => { dlg.querySelector('#dlg-ok').addEventListener('click', closeDialog); }
      });
      return;
    }

    const anonStuId = target.getAttribute('data-sc-anon-stu');
    if (anonStuId) {
      const st = db.students.find(x => x.id === anonStuId);
      if (!st) return;
      openDialog({
        title: `Xóa dữ liệu cá nhân (Ẩn danh hóa) — ${st.fullName}`,
        bodyHtml: `
          <div class="alert alert-danger">
            ${icon('alert', 20)}
            <div>
              Thao tác theo <strong>FR-016</strong> sẽ xóa vĩnh viễn họ tên, ngày sinh, quê quán, địa chỉ, tên và SĐT người giám hộ của học sinh <strong>${escapeHtml(st.fullName)} (${escapeHtml(st.code)})</strong>.<br/>
              Mã học sinh cũ sẽ bị vô hiệu (không tra cứu được nữa). Điểm và bài thi đã làm vẫn được giữ lại gắn với mã nội bộ ẩn danh.
            </div>
          </div>
        `,
        footerHtml: `<button type="button" class="btn btn-secondary" id="dlg-cancel">Hủy</button><button type="button" class="btn btn-danger" id="dlg-confirm">Xác nhận xóa & ẩn danh hóa</button>`,
        onMount: (dlg) => {
          dlg.querySelector('#dlg-cancel').addEventListener('click', closeDialog);
          dlg.querySelector('#dlg-confirm').addEventListener('click', () => {
            st.anonymized = true;
            st.anonCode = `ANON-${st.id.slice(-4).toUpperCase()}`;
            st.code = '';
            st.fullName = '';
            st.dob = '';
            st.hometown = '';
            st.address = '';
            st.guardianName = '';
            st.guardianPhone = '';
            closeDialog();
            showToast('Đã xóa toàn bộ thông tin cá nhân và ẩn danh hóa điểm thi của học sinh.');
            render();
          });
        }
      });
      return;
    }

    if (target.id === 'btn-sc-save-settings') {
      const sch = getSchool(uiState.currentUser.schoolId);
      sch.maxAttempts = Math.max(1, parseInt(document.getElementById('inp-cfg-max-att').value, 10) || 3);
      sch.maxWarnings = Math.max(0, parseInt(document.getElementById('inp-cfg-max-warn').value, 10) || 2);
      sch.disconnectTimeoutSec = Math.max(15, parseInt(document.getElementById('inp-cfg-timeout').value, 10) || 60);
      showToast('Đã lưu quy chế trường (áp dụng cho các bài thi phát đề từ thời điểm này).');
      render(); return;
    }

    if (target.id === 'btn-sc-add-assign') {
      const sid = uiState.currentUser.schoolId;
      const yearId = uiState.scAssignYearFilter || getCurrentYear(sid)?.id;
      const teachers = db.users.filter(u => u.role === 'teacher' && u.schoolId === sid);
      const classes = db.classes.filter(c => c.schoolId === sid && c.academicYearId === yearId);
      openDialog({
        title: `Phân công giáo viên phụ trách lớp (${getYearName(yearId)})`,
        bodyHtml: `
          <div class="field-group">
            <label class="field-label" for="dlg-asg-gv">Giáo viên</label>
            <select id="dlg-asg-gv" class="select">
              ${teachers.map(t => `<option value="${t.id}">${escapeHtml(t.fullName)} — Môn ${escapeHtml(getSubjectName(t.subjectId))}</option>`).join('')}
            </select>
          </div>
          <div class="field-group">
            <label class="field-label" for="dlg-asg-cls">Lớp học</label>
            <select id="dlg-asg-cls" class="select">
              ${classes.map(c => `<option value="${c.id}">Lớp ${escapeHtml(c.name)}</option>`).join('')}
            </select>
          </div>
        `,
        footerHtml: `<button type="button" class="btn btn-secondary" id="dlg-cancel">Hủy</button><button type="button" class="btn btn-primary" id="dlg-save">Lưu phân công</button>`,
        onMount: (dlg) => {
          dlg.querySelector('#dlg-cancel').addEventListener('click', closeDialog);
          dlg.querySelector('#dlg-save').addEventListener('click', () => {
            const teacherId = dlg.querySelector('#dlg-asg-gv').value;
            const classId = dlg.querySelector('#dlg-asg-cls').value;
            if (!teacherId || !classId) return;
            if (db.assignments.some(a => a.teacherId === teacherId && a.classId === classId && a.academicYearId === yearId)) {
              showToast('Phân công này đã tồn tại.', 'warning'); return;
            }
            db.assignments.push({ id: uid('asg'), schoolId: sid, academicYearId: yearId, teacherId, classId });
            closeDialog(); showToast('Đã lưu phân công giảng dạy.'); render();
          });
        }
      });
      return;
    }

    const delAsgId = target.getAttribute('data-sc-del-assign');
    if (delAsgId) {
      db.assignments = db.assignments.filter(a => a.id !== delAsgId);
      showToast('Đã gỡ phân công.'); render(); return;
    }

    const vaultTab = target.getAttribute('data-sc-vault-tab');
    if (vaultTab) { uiState.scVaultTab = vaultTab; render(); return; }

    const diffFilter = target.getAttribute('data-tc-diff');
    if (diffFilter) { uiState.tcBankDiffFilter = diffFilter; render(); return; }
    if (target.id === 'btn-tc-add-q') { openQuestionEditorDialog(null); return; }

    const editQId = target.getAttribute('data-tc-edit-q');
    if (editQId) { openQuestionEditorDialog(editQId); return; }

    const delQId = target.getAttribute('data-tc-del-q');
    if (delQId) {
      db.questions = db.questions.filter(q => q.id !== delQId);
      showToast('Đã xóa câu hỏi khỏi ngân hàng (bản sao ở các đề đã tạo vẫn giữ nguyên).');
      render(); return;
    }

    if (target.id === 'btn-tc-create-exam') { openCreateExamDialog(); return; }

    const copyCode = target.getAttribute('data-copy-exam-code');
    if (copyCode) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(copyCode).catch(() => {});
      }
      showToast(`Đã sao chép mã bài thi: ${copyCode}`);
      return;
    }

    const viewSnapId = target.getAttribute('data-tc-view-snapshot');
    if (viewSnapId) {
      const ex = db.exams.find(x => x.id === viewSnapId);
      if (!ex) return;
      openDialog({
        title: `Bản sao đề cố định — ${ex.title}`,
        wide: true,
        bodyHtml: `
          <p class="field-hint" style="margin:0">Các câu hỏi dưới đây đã được sao chép vào bài thi khi rút đề (${ex.questionSnapshot.length} câu).</p>
          ${ex.questionSnapshot.map((q, i) => `
            <div style="padding:12px;border:1.5px solid var(--border-subtle);border-radius:6px">
              <div style="font-weight:700;margin-bottom:4px">Câu ${i + 1}: ${escapeHtml(q.text)}</div>
              <div style="font-size:0.875rem;color:var(--status-success-text)">Đáp án đúng: ${escapeHtml(q.options.filter(o => o.isCorrect).map(o => o.text).join('; '))}</div>
            </div>
          `).join('')}
        `,
        footerHtml: `<button type="button" class="btn btn-primary" id="dlg-ok">Đóng</button>`,
        onMount: (dlg) => { dlg.querySelector('#dlg-ok').addEventListener('click', closeDialog); }
      });
      return;
    }

    const goLiveId = target.getAttribute('data-tc-go-live');
    if (goLiveId) {
      const ex = db.exams.find(x => x.id === goLiveId);
      uiState.tcLiveExamId = goLiveId;
      uiState.tcLiveClassId = ex?.assignedClassIds[0] || '';
      uiState.activeView = 'tc_live_room';
      render(); return;
    }

    const delExamId = target.getAttribute('data-tc-del-exam');
    if (delExamId) {
      if (countExamAttempts(delExamId) > 0) {
        showToast('Không thể xóa đề thi đã có học sinh làm bài (BR-002).', 'error');
        return;
      }
      db.exams = db.exams.filter(x => x.id !== delExamId);
      showToast('Đã xóa bài thi.'); render(); return;
    }

    if (target.id === 'btn-live-release') {
      const ex = db.exams.find(e => e.id === uiState.tcLiveExamId);
      const clsState = ex?.classStates[uiState.tcLiveClassId];
      const sch = getSchool(uiState.currentUser.schoolId);
      if (clsState) {
        clsState.releaseStatus = 'released';
        clsState.releasedAt = Date.now();
        clsState.maxAttemptsSnap = sch.maxAttempts;
        clsState.maxWarningsSnap = sch.maxWarnings;
        showToast(`Đã phát đề cho lớp ${getClass(uiState.tcLiveClassId)?.name}. Học sinh lớp này có thể bấm "Bắt đầu làm bài".`);
        render();
      }
      return;
    }

    if (target.id === 'btn-live-close') {
      const ex = db.exams.find(e => e.id === uiState.tcLiveExamId);
      const clsId = uiState.tcLiveClassId;
      const clsState = ex?.classStates[clsId];
      if (!ex || !clsState) return;
      openDialog({
        title: `Đóng / Thu bài lớp ${getClass(clsId)?.name}`,
        bodyHtml: `<div class="alert alert-warning">${icon('alert', 20)}<div>Học sinh đang làm dở sẽ bị tự nộp và chấm ngay; học sinh ở phòng chờ không thể bắt đầu làm bài nữa; học sinh đang gián đoạn chốt điểm cao nhất (FR-034).</div></div>`,
        footerHtml: `<button type="button" class="btn btn-secondary" id="dlg-cancel">Hủy</button><button type="button" class="btn btn-danger" id="dlg-confirm">Xác nhận thu bài</button>`,
        onMount: (dlg) => {
          dlg.querySelector('#dlg-cancel').addEventListener('click', closeDialog);
          dlg.querySelector('#dlg-confirm').addEventListener('click', () => {
            clsState.releaseStatus = 'closed';
            const clsStudents = new Set(getStudentsInClass(clsId, ex.academicYearId).map(s => s.id));
            db.attempts.forEach(att => {
              if (att.examId === ex.id && clsStudents.has(att.studentId) && att.status === 'in_progress') {
                att.status = 'submitted';
                att.endedAt = Date.now();
                att.endReason = 'Tự nộp do giáo viên thu bài';
                att.score = gradeAttempt(ex, att);
              }
            });
            closeDialog();
            showToast(`Đã đóng và thu bài lớp ${getClass(clsId)?.name}.`);
            render();
          });
        }
      });
      return;
    }

    if (target.id === 'btn-live-pub-ans') {
      const ex = db.exams.find(e => e.id === uiState.tcLiveExamId);
      const clsState = ex?.classStates[uiState.tcLiveClassId];
      if (clsState) {
        clsState.answersPublished = !clsState.answersPublished;
        showToast(clsState.answersPublished ? 'Đã công bố đáp án cho lớp.' : 'Đã ẩn công bố đáp án.');
        render();
      }
      return;
    }

    if (target.id === 'btn-live-pub-scores') {
      const ex = db.exams.find(e => e.id === uiState.tcLiveExamId);
      const clsState = ex?.classStates[uiState.tcLiveClassId];
      if (clsState) {
        clsState.scoresPublished = !clsState.scoresPublished;
        showToast(clsState.scoresPublished ? 'Đã công bố bảng điểm cho lớp lên tra cứu công khai.' : 'Đã ẩn công bố bảng điểm.');
        render();
      }
      return;
    }

    const openDetail = target.getAttribute('data-tc-open-detail');
    if (openDetail) {
      const [exId, stId] = openDetail.split('|');
      uiState.tcDetailExamId = exId;
      uiState.tcDetailStudentId = stId;
      uiState.activeView = 'tc_attempt_detail';
      render(); return;
    }

    if (target.id === 'btn-tc-back-results') {
      uiState.activeView = 'tc_results';
      render(); return;
    }

    const resTab = target.getAttribute('data-res-tab');
    if (resTab) { uiState.tcResultTab = resTab; render(); return; }

    if (target.id === 'btn-tc-export-excel') {
      exportClassScoresCSV(uiState.tcResultExamId, uiState.tcResultClassId);
      return;
    }

    if (target.id === 'btn-tc-save-regrade') {
      const ex = db.exams.find(e => e.id === uiState.tcResultExamId);
      if (!ex) return;
      for (const q of ex.questionSnapshot) {
        const checked = Array.from(document.querySelectorAll(`input[data-regrade-q="${q.id}"]:checked`)).map(el => el.value);
        if (checked.length === 0) {
          showToast('Mỗi câu hỏi phải giữ ít nhất 1 đáp án đúng trước khi chấm lại.', 'error');
          return;
        }
        q.options.forEach(o => { o.isCorrect = checked.includes(o.id); });
      }
      const n = regradeExam(ex.id);
      showToast(`Đã cập nhật đáp án trên bản sao đề và chấm lại tự động ${n} lượt làm bài.`);
      render(); return;
    }

    if (target.id === 'btn-st-exit-portal' || target.id === 'btn-st-finish-exit') {
      uiState.studentSession = null;
      uiState.activeView = 'portal';
      uiState.portalTab = 'student_join';
      render(); return;
    }

    if (target.id === 'btn-st-start-exam') {
      startStudentAttempt();
      return;
    }

    const jumpQ = target.getAttribute('data-st-jump-q');
    if (jumpQ !== null) {
      uiState.studentSession.currentQIndex = Number(jumpQ);
      render(); return;
    }

    if (target.id === 'btn-st-prev-q') {
      uiState.studentSession.currentQIndex = Math.max(0, uiState.studentSession.currentQIndex - 1);
      render(); return;
    }

    if (target.id === 'btn-st-next-q') {
      const exam = db.exams.find(x => x.id === uiState.studentSession.examId);
      uiState.studentSession.currentQIndex = Math.min(exam.questionSnapshot.length - 1, uiState.studentSession.currentQIndex + 1);
      render(); return;
    }

    if (target.id === 'btn-st-flag-q') {
      const att = db.attempts.find(a => a.id === uiState.studentSession.activeAttemptId);
      const qid = att.shuffledQuestionIds[uiState.studentSession.currentQIndex];
      const idx = uiState.studentSession.flaggedQIds.indexOf(qid);
      if (idx >= 0) uiState.studentSession.flaggedQIds.splice(idx, 1);
      else uiState.studentSession.flaggedQIds.push(qid);
      render(); return;
    }

    const optLabel = target.closest('[data-st-opt]');
    if (optLabel) {
      e.preventDefault();
      const optId = optLabel.getAttribute('data-st-opt');
      const sess = uiState.studentSession;
      const exam = db.exams.find(x => x.id === sess.examId);
      const att = db.attempts.find(a => a.id === sess.activeAttemptId);
      const qid = att.shuffledQuestionIds[sess.currentQIndex];
      const q = exam.questionSnapshot.find(x => x.id === qid);
      if (q.multiSelect) {
        const cur = att.answers[qid] || [];
        if (cur.includes(optId)) {
          att.answers[qid] = cur.filter(id => id !== optId);
        } else {
          att.answers[qid] = [...cur, optId];
        }
      } else {
        att.answers[qid] = [optId];
      }
      render(); return;
    }

    if (target.id === 'btn-st-submit-exam') {
      const sess = uiState.studentSession;
      const att = db.attempts.find(a => a.id === sess.activeAttemptId);
      const answered = att.shuffledQuestionIds.filter(id => (att.answers[id] || []).length > 0).length;
      const total = att.shuffledQuestionIds.length;
      openDialog({
        title: 'Xác nhận nộp bài thi',
        bodyHtml: `
          <p style="margin:0">Bạn đã trả lời <strong>${answered} / ${total}</strong> câu hỏi.</p>
          ${answered < total ? `<div class="alert alert-warning">${icon('alert', 18)}<div>Còn <strong>${total - answered}</strong> câu chưa chọn đáp án (câu bỏ trống tính là sai). Bạn có chắc chắn muốn nộp bài ngay?</div></div>` : '<p class="field-hint">Sau khi nộp bài, bạn sẽ không thể làm lại bài thi này.</p>'}
        `,
        footerHtml: `<button type="button" class="btn btn-secondary" id="dlg-cancel">Tiếp tục làm</button><button type="button" class="btn btn-success" id="dlg-confirm">Xác nhận nộp bài</button>`,
        onMount: (dlg) => {
          dlg.querySelector('#dlg-cancel').addEventListener('click', closeDialog);
          dlg.querySelector('#dlg-confirm').addEventListener('click', () => {
            closeDialog();
            finalizeStudentAttempt('Học sinh tự nộp bài', true);
          });
        }
      });
      return;
    }

    if (target.id === 'btn-sim-tab-leave') {
      recordStudentViolation('Rời tab / Thoát chế độ toàn màn hình');
      return;
    }

    if (target.id === 'btn-sim-disconnect') {
      finalizeStudentAttempt('Gián đoạn do mất kết nối quá 60 giây', false);
      return;
    }

    if (target.id === 'btn-st-view-answers') {
      const sess = uiState.studentSession;
      const exam = db.exams.find(e => e.id === sess.examId);
      const clsState = exam.classStates[sess.classId];
      if (!clsState.answersPublished) {
        sess.answerError = 'Giáo viên chưa công bố đáp án';
        sess.showAnswersOnResult = false;
      } else {
        sess.answerError = '';
        sess.showAnswersOnResult = true;
      }
      render(); return;
    }
  });

  render();
})();
  </script>
</body>
</html>
